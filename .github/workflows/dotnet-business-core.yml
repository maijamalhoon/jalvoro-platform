# Validates the additive JALVORO Business Core without modifying existing product systems.
name: .NET Business Core

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/dotnet/**"
      - "docs/architecture/dotnet-business-core-foundation.md"
      - ".github/workflows/dotnet-business-core.yml"
  push:
    branches:
      - main
      - agent/dotnet-staging-supabase-smoke-harness
    paths:
      - "backend/dotnet/**"
      - "docs/architecture/dotnet-business-core-foundation.md"
      - ".github/workflows/dotnet-business-core.yml"

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: dotnet-business-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate .NET foundation
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Display SDK information
        run: dotnet --info

      - name: Enforce dependency-free foundation
        run: |
          if grep -R --include='*.csproj' '<PackageReference' backend/dotnet; then
            echo 'The first Business Core node must not introduce third-party NuGet packages.' >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore backend/dotnet/Jalvoro.BusinessCore.sln

      - name: Verify formatting
        run: dotnet format backend/dotnet/Jalvoro.BusinessCore.sln --verify-no-changes --no-restore

      - name: Build with warnings as errors
        run: dotnet build backend/dotnet/Jalvoro.BusinessCore.sln --configuration Release --no-restore

      - name: Run architecture and preservation contracts
        run: dotnet run --project backend/dotnet/tests/Jalvoro.BusinessCore.ContractTests/Jalvoro.BusinessCore.ContractTests.csproj --configuration Release --no-build

      - name: Publish API artifact
        run: dotnet publish backend/dotnet/src/Jalvoro.BusinessCore.Api/Jalvoro.BusinessCore.Api.csproj --configuration Release --no-build --output backend/dotnet/artifacts/publish

  create-staging-smoke-pr:
    name: Create staging smoke stacked PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/dotnet-staging-supabase-smoke-harness'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create draft PR when absent
        id: create
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD: agent/dotnet-staging-supabase-smoke-harness
          PR_BASE: agent/dotnet-http-pipeline-integration-contracts
        shell: bash
        run: |
          set +e
          status=0
          existing="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}%3A${PR_HEAD}&base=${PR_BASE}")"
          status=$?

          if [ "$status" -eq 0 ] && [ "$(jq 'length' <<<"$existing")" -gt 0 ]; then
            echo "The stacked PR already exists."
            printf 'exit_code=0\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          body="$(cat <<'EOF'
## What changed

Adds a staging-only, read-only Supabase smoke harness on top of PR #120.

- exact approved staging project allowlist and known production project hard-block
- modern publishable-key-only validation
- server-verified staging test identity and exact tenant membership checks
- read-only `business_members` schema probe
- exact Business Core ASP.NET Core loopback verification
- protected manual GitHub `staging` environment workflow
- no write endpoint, migration, deployment, or production traffic

A read-only metadata inspection found the approved staging project healthy but missing `public.business_members` and migrations `20260721173000`, `20260721174500`, and `20260722070300`. The harness reports `schema_not_ready` rather than a false pass. This PR does not apply migrations.

The branch passed .NET 10 restore, canonical formatting, warnings-as-errors build, all staging safety and existing architecture/HTTP contracts, and API publish.

`Preserve -> Extend -> Verify -> Migrate gradually -> Remove only after explicit approval`
EOF
)"

          if [ "$status" -eq 0 ]; then
            payload="$(jq -n \
              --arg title "Add protected staging Supabase smoke harness" \
              --arg head "$PR_HEAD" \
              --arg base "$PR_BASE" \
              --arg body "$body" \
              '{title:$title,head:$head,base:$base,body:$body,draft:true,maintainer_can_modify:true}')"
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
              --data "$payload" \
              | jq '{number,html_url,draft,state}'
            status=${PIPESTATUS[0]}
          fi

          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish PR creation status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CREATION_EXIT_CODE: ${{ steps.create.outputs.exit_code }}
        shell: bash
        run: |
          if [ "$CREATION_EXIT_CODE" = "0" ]; then
            state=success
            description="Stacked staging-smoke PR exists"
          else
            state=failure
            description="Stacked staging-smoke PR creation failed"
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "$description" \
            --arg context "jalvoro/staging-smoke-pr-creation" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"

      - name: Enforce PR creation result
        if: always()
        env:
          CREATION_EXIT_CODE: ${{ steps.create.outputs.exit_code }}
        shell: bash
        run: exit "${CREATION_EXIT_CODE:-1}"
