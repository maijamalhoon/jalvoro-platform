name: Command Center registry lint repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    name: Apply exact registry lint repair
    if: github.head_ref == 'agent/command-center-registry-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          show-progress: false

      - name: Rename protected local variable and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/admin/product-registry.ts')
          source = path.read_text()
          old = '''      const module = modules.get(entry.moduleKey);
                if (!module?.enabled) continue;
                if (!entry.environments.includes(context.environment)) continue;
                if (!hasPermissions(context.permissions, module.requiredPermissions)) continue;
          '''
          new = '''      const productModule = modules.get(entry.moduleKey);
                if (!productModule?.enabled) continue;
                if (!entry.environments.includes(context.environment)) continue;
                if (!hasPermissions(context.permissions, productModule.requiredPermissions)) continue;
          '''
          if source.count(old) != 1:
              raise SystemExit('Exact registry lint target was not found once; refusing to modify the branch.')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/command-center-lint-diagnostic.yml
          git diff --check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin/product-registry.ts .github/workflows/command-center-lint-diagnostic.yml
          git commit -m "Fix Command Center registry lint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
