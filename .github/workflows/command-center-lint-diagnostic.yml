name: Command Center lint diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  lint-diagnostic:
    name: Capture lint diagnostics
    if: github.head_ref == 'agent/command-center-registry-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci --silent

      - name: Capture ESLint JSON
        continue-on-error: true
        run: npm run lint -- --format json --output-file lint-report.json

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-lint-report
          path: lint-report.json
          if-no-files-found: error
          retention-days: 1
