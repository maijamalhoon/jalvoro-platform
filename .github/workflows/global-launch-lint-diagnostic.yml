name: Global launch source diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false

      - name: Upload AI Insights source
        uses: actions/upload-artifact@v4
        with:
          name: global-launch-ai-insights-source
          path: components/ai-insights/AIInsightsExplainablePanel.tsx
          if-no-files-found: error
          retention-days: 1
