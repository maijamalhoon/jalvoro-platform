name: Sync Command Center with hardened main

on:
  push:
    branches:
      - agent/global-command-center-launch-polish
    paths:
      - .github/workflows/sync-command-center-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Command Center branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge hardened main with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml|\
                .github/workflows/security.yml|\
                components/ai-insights/AIInsightsExplainablePanel.tsx|\
                lib/ai-insights/locale.ts|\
                lib/brand.ts|\
                lib/dependency-audit-policy.test.ts|\
                package.json|\
                scripts/dependency-audit-policy.ts|\
                vercel.json|\
                docs/global-launch-pr-validation-2026-07-25.md)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unhandled merge conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
          fi

          rm -f scripts/enforce-dependency-audit.mjs
          rm -f docs/security/temporary-eslint-brace-expansion-advisory.md
          git rm -f .github/workflows/sync-command-center-main.yml
          git add -A

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            exit 1
          fi

          git commit -m "Sync Command Center with hardened main"
          git push origin HEAD:agent/global-command-center-launch-polish
