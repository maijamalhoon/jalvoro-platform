name: Export standalone Command Center acceptance build

on:
  push:
    branches:
      - agent/global-command-center-launch-polish
    paths:
      - .github/workflows/export-command-center-standalone.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://tdagzmgcgjlyqzegmizg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkYWd6bWdjZ2pseXF6ZWdtaXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzg1NjQsImV4cCI6MjA5NjkxNDU2NH0.4ix9a51FFsFZgE2zRrg8XQjivWGTeLWnP8z8yAQwQhQ
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare one-shot cleanup and standalone packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-command-center-standalone.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('next.config.ts')
          text = path.read_text()
          marker = 'const nextConfig: NextConfig = {\n'
          if marker not in text:
              raise SystemExit('nextConfig marker not found')
          path.write_text(text.replace(marker, marker + '  output: "standalone",\n', 1))
          PY
          printf 'run_id=%s\nsource_commit=%s\nartifact=command-center-standalone-%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > docs/command-center-standalone-export.txt

      - name: Install dependencies
        run: npm ci --silent

      - name: Build exact production application
        run: npm run build

      - name: Assemble runnable standalone bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/COMMAND_CENTER_SOURCE_HEAD
          tar -C .next/standalone -czf /tmp/command-center-standalone.tar.gz .
          sha256sum /tmp/command-center-standalone.tar.gz > /tmp/standalone-sha256.txt
          stat --printf='bytes=%s\n' /tmp/command-center-standalone.tar.gz >> /tmp/standalone-sha256.txt

      - name: Upload runnable acceptance build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-center-standalone-${{ github.run_id }}
          path: |
            /tmp/command-center-standalone.tar.gz
            /tmp/standalone-sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Record export and remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- next.config.ts || true
          if [ ! -f docs/command-center-standalone-export.txt ]; then
            printf 'run_id=%s\nsource_commit=%s\nstatus=build_failed\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > docs/command-center-standalone-export.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record standalone Command Center acceptance build"
          git push origin HEAD:agent/global-command-center-launch-polish
