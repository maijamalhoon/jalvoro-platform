name: Command Center exact-head gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/admin/**"
      - "app/control/**"
      - "app/control-login/**"
      - "app/control-invite/**"
      - "components/admin/**"
      - "components/control-plane/**"
      - "lib/admin/**"
      - "lib/control-plane/**"
      - "supabase/control-plane/**"
      - ".github/workflows/command-center-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: command-center-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-command-center:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci --silent

      - name: Enforce dependency policy
        run: npm run audit:ci

      - name: Validate brand, formatting, release environment, lint, strict TypeScript and tests
        run: npm run check

      - name: Build complete production application
        run: npm run build

      - name: Verify exact head stayed clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
