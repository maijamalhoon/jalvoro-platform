# Validates every main release candidate before deployment.
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci --silent

      - name: Generate non-forced audit fix candidate
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          set -e
          npm ci --silent

      - name: Capture candidate dependency audit
        id: dependency_audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=low --json > npm-audit.json
          status=$?
          set -e
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload candidate lockfile and audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-fix-candidate
          path: |
            package.json
            package-lock.json
            npm-audit.json
          retention-days: 1
          if-no-files-found: error

      - name: Enforce zero known dependency vulnerabilities
        env:
          AUDIT_EXIT_CODE: ${{ steps.dependency_audit.outputs.exit_code }}
        run: exit "${AUDIT_EXIT_CODE:-1}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run security contract tests
        run: npx vitest run lib/security-hardening.test.ts

      - name: Run complete application suite
        run: npm test

      - name: Build production application
        run: npm run build
