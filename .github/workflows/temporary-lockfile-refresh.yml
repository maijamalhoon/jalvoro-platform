name: Temporary lockfile refresh

on:
  push:
    branches:
      - agent/landing-hero-carousel-dark-mode
    paths:
      - package.json
      - .github/workflows/temporary-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/landing-hero-carousel-dark-mode
          persist-credentials: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched lock entries
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json')
          const packages = lock.packages || {}
          const versions = Object.entries(packages)
            .filter(([path]) => /node_modules\/(postcss|fast-uri|brace-expansion)$/.test(path))
            .map(([path, value]) => `${path}: ${value.version}`)
          console.log(versions.join('\n'))
          if (!versions.some((line) => line.endsWith('postcss: 8.5.23'))) process.exit(1)
          if (!versions.some((line) => line.endsWith('fast-uri: 3.1.5'))) process.exit(1)
          if (!versions.some((line) => line.endsWith('brace-expansion: 5.0.9'))) process.exit(1)
          NODE

      - name: Commit verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the secure dependency graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched transitive dependencies"
          git push origin HEAD:agent/landing-hero-carousel-dark-mode
