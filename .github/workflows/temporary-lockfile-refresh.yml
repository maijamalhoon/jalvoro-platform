name: Temporary lockfile refresh

on:
  push:
    branches:
      - agent/landing-hero-carousel-dark-mode
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/temporary-lockfile-refresh.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched lock entries
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json')
          const packages = lock.packages || {}
          const versions = Object.entries(packages)
            .filter(([path]) => /node_modules\/(postcss|fast-uri|brace-expansion)$/.test(path))
            .map(([path, value]) => `${path}: ${value.version}`)
          console.log(versions.join('\n'))
          if (!versions.some((line) => line.endsWith('postcss: 8.5.23'))) process.exit(1)
          if (!versions.some((line) => line.endsWith('fast-uri: 3.1.5'))) process.exit(1)
          if (!versions.some((line) => line.endsWith('brace-expansion: 5.0.9'))) process.exit(1)
          NODE

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landing-security-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
