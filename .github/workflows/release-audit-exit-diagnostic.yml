name: Release audit exit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Capture exact audit command
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=low > audit-output.txt 2>&1
          code=$?
          printf 'exit_code=%s\n\n' "$code" > audit-exit-diagnostic.txt
          cat audit-output.txt >> audit-exit-diagnostic.txt
          exit 0
      - name: Upload audit exit diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-exit-diagnostic
          path: audit-exit-diagnostic.txt
          retention-days: 1
          if-no-files-found: error
