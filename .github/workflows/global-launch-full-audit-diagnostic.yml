name: Global launch patched dependency candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Pin patched glob dependencies
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = {
            ...pkg.overrides,
            minimatch: '10.2.5',
            'brace-expansion': '5.0.8'
          }
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE
          npm install --package-lock-only --ignore-scripts --silent

      - name: Install patched dependency tree
        run: npm ci --silent

      - name: Enforce zero known vulnerabilities
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run security contract tests
        run: npx vitest run lib/security-hardening.test.ts

      - name: Run complete application suite
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Capture patched dependency tree
        if: always()
        shell: bash
        run: |
          npm ls eslint eslint-config-next minimatch brace-expansion --all --json > global-launch-patched-tree.json 2>/dev/null || true

      - name: Upload patched candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-launch-patched-dependency-candidate
          path: |
            package.json
            package-lock.json
            global-launch-patched-tree.json
          if-no-files-found: error
          retention-days: 1
