name: Global launch full dependency audit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci --silent

      - name: Capture full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=low --json > global-launch-full-audit.json 2> global-launch-full-audit.stderr
          exit_code=$?
          echo "audit_exit_code=${exit_code}" > global-launch-full-audit-exit.txt
          npm ls eslint eslint-config-next minimatch brace-expansion --all --json > global-launch-dependency-tree.json 2>/dev/null || true
          exit 0

      - name: Upload full dependency diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: global-launch-full-dependency-audit
          path: |
            global-launch-full-audit.json
            global-launch-full-audit.stderr
            global-launch-full-audit-exit.txt
            global-launch-dependency-tree.json
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
