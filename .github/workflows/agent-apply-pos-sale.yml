name: Apply reviewed POS sale bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-pos-sale-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pos-sale-bridge-20260727' &&
      github.event.pull_request.base.ref == 'agent/pos-workforce-security-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact POS sale staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify, apply, and self-remove reviewed sale bridge
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PAYLOAD_B64_SHA256: b82f7a64eb44b3e56078522521c7bd155027f424413ac9f2d50fd7162e287e55
          PAYLOAD_TGZ_SHA256: 7d1bfaa4c92f2294f73208fb2e8421fd11d147a6b3525237cb0db19d55795f6b
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$HEAD_BRANCH" = "agent/pos-sale-bridge-20260727"

          cat .agent/pos-sale-bridge.part-* > /tmp/pos-sale-bridge.b64
          printf '%s  %s\n' "$PAYLOAD_B64_SHA256" /tmp/pos-sale-bridge.b64 | sha256sum --check --strict
          base64 --decode /tmp/pos-sale-bridge.b64 > /tmp/pos-sale-bridge.tgz
          printf '%s  %s\n' "$PAYLOAD_TGZ_SHA256" /tmp/pos-sale-bridge.tgz | sha256sum --check --strict

          tar -tzf /tmp/pos-sale-bridge.tgz | sed 's#^\./##' | sort > /tmp/actual-manifest
          cat > /tmp/expected-manifest <<'EOF'
          lib/security-hardening.test.ts
          supabase/functions/business-pos-security/index.ts
          supabase/migrations/20260727060000_pos_sale_transaction_bridge.sql
          supabase/tests/business_pos_sale_bridge.sql
          tests/business-pos-sale-bridge-contract.test.ts
          EOF
          sort -o /tmp/expected-manifest /tmp/expected-manifest
          diff -u /tmp/expected-manifest /tmp/actual-manifest

          tar -xzf /tmp/pos-sale-bridge.tgz

          cat > /tmp/expected-sha256 <<'EOF'
          71ede883fdf1bc9f11c4993b19f1b3ddc42fa29146cb15c833e3602d9a28e419  lib/security-hardening.test.ts
          99709192c7aa7a09feb7701e20aa9b2852896e400a1452442b132a69cbb02781  supabase/functions/business-pos-security/index.ts
          c9d940cdea4918b96796908d346992d56049fec5eb936d28748def8b9edb9d42  supabase/migrations/20260727060000_pos_sale_transaction_bridge.sql
          f7b13e2945edc04515c857f14bdd8578f24d4931aa827580f5df2165dfd16328  supabase/tests/business_pos_sale_bridge.sql
          380e03142218bbd0d46cc2ce1cac151501a1084d1cee958acc9bdec630e2a1e4  tests/business-pos-sale-bridge-contract.test.ts
          EOF
          sha256sum --check --strict /tmp/expected-sha256

          rm -f .agent/pos-sale-bridge.part-* .github/workflows/agent-apply-pos-sale.yml
          rmdir .agent 2>/dev/null || true

          git add -A -- \
            .agent \
            .github/workflows/agent-apply-pos-sale.yml \
            lib/security-hardening.test.ts \
            supabase/functions/business-pos-security/index.ts \
            supabase/migrations/20260727060000_pos_sale_transaction_bridge.sql \
            supabase/tests/business_pos_sale_bridge.sql \
            tests/business-pos-sale-bridge-contract.test.ts
          test -n "$(git status --porcelain)"
          git diff --cached --check
          git config user.name "jalvoro-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add POS cashier sale transaction bridge"
          git push origin "HEAD:$HEAD_BRANCH"
