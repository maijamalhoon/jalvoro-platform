name: Export Command Center source snapshot

on:
  push:
    branches:
      - agent/global-command-center-launch-polish
    paths:
      - .github/workflows/export-command-center-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare exact post-cleanup source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-command-center-source.yml
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.vercel \
            --exclude='*.log' \
            -czf /tmp/jalvoro-command-center-source.tar.gz .
          sha256sum /tmp/jalvoro-command-center-source.tar.gz | tee /tmp/source-sha256.txt

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-center-source-${{ github.sha }}
          path: |
            /tmp/jalvoro-command-center-source.tar.gz
            /tmp/source-sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Remove one-shot export workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-command-center-source.yml
          git commit -m "Remove one-shot Command Center source exporter"
          git push origin HEAD:agent/global-command-center-launch-polish
