name: Currency quality gate

on:
  push:
    branches: [main]
    paths:
      - "lib/currency.ts"
      - "lib/currency-input.ts"
      - "lib/exchange-rate.ts"
      - "lib/supabase/client.ts"
      - "lib/investments/**"
      - "components/currency/**"
      - "components/settings/**"
      - "components/accounts/**"
      - "components/dashboard/**"
      - "components/goals/**"
      - "components/payables/**"
      - "components/investments/**"
      - "components/reports/**"
      - "app/api/exchange-rate/**"
      - "app/dashboard/**"
      - "supabase/migrations/**"
      - ".github/workflows/currency-quality-gate.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "lib/currency.ts"
      - "lib/currency-input.ts"
      - "lib/exchange-rate.ts"
      - "lib/supabase/client.ts"
      - "lib/investments/**"
      - "components/currency/**"
      - "components/settings/**"
      - "components/accounts/**"
      - "components/dashboard/**"
      - "components/goals/**"
      - "components/payables/**"
      - "components/investments/**"
      - "components/reports/**"
      - "app/api/exchange-rate/**"
      - "app/dashboard/**"
      - "supabase/migrations/**"
      - ".github/workflows/currency-quality-gate.yml"

permissions:
  contents: read

concurrency:
  group: currency-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci --silent

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Capture TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > typescript.log 2>&1
          status=$?
          set -e
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-profile-typescript-diagnostics
          path: typescript.log
          retention-days: 1
          if-no-files-found: error

      - name: Enforce TypeScript result
        env:
          TYPECHECK_EXIT_CODE: ${{ steps.typecheck.outputs.exit_code }}
        run: exit "${TYPECHECK_EXIT_CODE:-1}"

      - name: Test currency conversions
        run: npx vitest run lib/currency.test.ts

      - name: Build production application
        run: npm run build
