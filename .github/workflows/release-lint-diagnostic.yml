name: Release lint diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          code=$?
          printf 'exit_code=%s\n\n' "$code" > lint-diagnostic.txt
          cat lint-output.txt >> lint-diagnostic.txt
          exit 0
      - name: Upload lint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: release-lint-diagnostic
          path: lint-diagnostic.txt
          retention-days: 1
          if-no-files-found: error
