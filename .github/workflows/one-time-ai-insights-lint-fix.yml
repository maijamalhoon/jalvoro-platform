name: One-time AI Insights lint source fix

on:
  push:
    branches:
      - agent/global-command-center-launch-polish
    paths:
      - ".github/workflows/one-time-ai-insights-lint-fix.yml"

permissions:
  contents: write

concurrency:
  group: one-time-ai-insights-lint-fix
  cancel-in-progress: false

jobs:
  apply-exact-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/global-command-center-launch-polish
          persist-credentials: true
          fetch-depth: 0

      - name: Apply behavior-neutral dependency correction
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path("components/ai-insights/AIInsightsExplainablePanel.tsx")
          workflow = Path(".github/workflows/one-time-ai-insights-lint-fix.yml")
          text = source.read_text()
          old = "    [copy.panel.unavailable, copy.server.emptyMessage, currency, language, live, rate],"
          new = """    [
                copy.panel.unavailable,
                copy.server.emptyMessage,
                currency,
                language,
                live,
                rate,
                setData,
                setEmptyMessage,
                setError,
                setLoading,
                setRegenerating,
                setSummary,
                setSummaryCards,
              ],"""

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one dependency array; found {text.count(old)}")

          source.write_text(text.replace(old, new))
          workflow.unlink()
          PY

          git diff --check
          git diff -- components/ai-insights/AIInsightsExplainablePanel.tsx

      - name: Commit exact source fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ai-insights/AIInsightsExplainablePanel.tsx .github/workflows/one-time-ai-insights-lint-fix.yml
          git commit -m "Preserve AI Insights callback dependencies"
          git push origin HEAD:agent/global-command-center-launch-polish
