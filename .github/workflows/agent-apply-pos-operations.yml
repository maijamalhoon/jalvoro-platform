name: Apply reviewed POS operations tranche

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-pos-operations-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pos-operations-bridge-20260727' &&
      github.event.pull_request.base.ref == 'agent/pos-sale-bridge-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact POS operations staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify, apply, and self-remove reviewed payload
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          cat \
            .agent/pos-ops.part-00 \
            .agent/pos-ops.part-01 \
            .agent/pos-ops.part-02 \
            .agent/pos-ops.part-03 \
            .agent/pos-ops.part-04 \
            .agent/pos-ops.part-05 \
            .agent/pos-ops.part-06 \
            .agent/pos-ops.part-07-08 \
            .agent/pos-ops.part-09-10 \
            .agent/pos-ops.part-11-12 \
            .agent/pos-ops.part-13-14 \
            .agent/pos-ops.part-15 \
            .agent/pos-ops.part-16 \
            .agent/pos-ops.part-17 \
            .agent/pos-ops.part-18 \
            .agent/pos-ops.part-19 \
            .agent/pos-ops.part-20 \
            .agent/pos-ops.part-21 \
            .agent/pos-ops.part-22 > /tmp/pos-operations.b64

          base64 --decode /tmp/pos-operations.b64 > /tmp/pos-operations.tgz
          echo 'ec9bc78675f538ed914e9ea6c569244aa40160add629774b14b84937cd393c6b  /tmp/pos-operations.tgz' | sha256sum --check --strict

          cat > /tmp/expected-files.txt <<'FILES'
          app/business/[businessSlug]/pos-security/page.tsx
          app/pos/[businessSlug]/page.tsx
          components/business/BusinessPosTerminal.tsx
          lib/security-hardening.test.ts
          lib/supabase/proxy.ts
          supabase/functions/business-pos-security/index.ts
          supabase/migrations/20260727070000_pos_operations_transaction_bridge.sql
          supabase/tests/business_pos_operations_bridge.sql
          tests/business-pos-operations-bridge-contract.test.ts
          FILES
          tar -tzf /tmp/pos-operations.tgz | sed 's#^\./##' | sort > /tmp/actual-files.txt
          sort /tmp/expected-files.txt -o /tmp/expected-files.txt
          diff --unified /tmp/expected-files.txt /tmp/actual-files.txt

          rm -rf /tmp/pos-operations
          mkdir -p /tmp/pos-operations
          tar -xzf /tmp/pos-operations.tgz \
            --directory /tmp/pos-operations \
            --no-same-owner \
            --no-same-permissions

          cat > /tmp/file-hashes.txt <<'HASHES'
          80561330281e64c834f6584a794c48cf1f2fa9b784311804d926bf1b80ec312d  app/pos/[businessSlug]/page.tsx
          eda9f44dc453a2fe1437862630bc649e98036155995f7edaba4d886aa7c5e5cb  app/business/[businessSlug]/pos-security/page.tsx
          b62279a6c995a01003bffae14efb62939594a055c2ef509017410565187e2763  components/business/BusinessPosTerminal.tsx
          7c4d9435a0f7736d33f512e46d8ae023cc9c78b000a8956b20d3d6ea8cdcf00e  lib/supabase/proxy.ts
          1fce0bc76a7547b04c586f40981fde3a7c72190f46544fac31773e17f79e7ab5  lib/security-hardening.test.ts
          8fddcf27b067115553b1c369c931aea7ba67ff058b9c9d94dc62717d68572f08  supabase/functions/business-pos-security/index.ts
          18b1c43ac7dcc028e64941c3202ad816a4da5d462e8a5d1ac2c24ed8da867e25  supabase/migrations/20260727070000_pos_operations_transaction_bridge.sql
          f139fb7becac43e654065fc026f9a3ab906fa73bc3c0812474de13a20daea48d  supabase/tests/business_pos_operations_bridge.sql
          91af6292cd9a1785a26d704af50a5c4baa95c2e361213f1b6b425e64da537d36  tests/business-pos-operations-bridge-contract.test.ts
          HASHES
          (cd /tmp/pos-operations && sha256sum --check --strict /tmp/file-hashes.txt)

          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp -- "/tmp/pos-operations/$path" "$path"
          done < /tmp/expected-files.txt

          rm -f .agent/pos-ops.part-* .github/workflows/agent-apply-pos-operations.yml
          git add --all -- \
            app/business/'[businessSlug]'/pos-security/page.tsx \
            app/pos/'[businessSlug]'/page.tsx \
            components/business/BusinessPosTerminal.tsx \
            lib/security-hardening.test.ts \
            lib/supabase/proxy.ts \
            supabase/functions/business-pos-security/index.ts \
            supabase/migrations/20260727070000_pos_operations_transaction_bridge.sql \
            supabase/tests/business_pos_operations_bridge.sql \
            tests/business-pos-operations-bridge-contract.test.ts \
            .agent \
            .github/workflows/agent-apply-pos-operations.yml

          git diff --cached --check
          test -n "$(git status --porcelain)"
          git config user.name 'jalvoro-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add POS operations transaction bridge'
          git push origin "HEAD:$HEAD_BRANCH"
