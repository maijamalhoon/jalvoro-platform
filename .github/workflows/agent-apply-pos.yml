name: Apply reviewed POS tranche

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-pos-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pos-workforce-security-20260727' &&
      github.event.pull_request.base.ref == 'agent/business-identity-recovery-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact POS staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify, apply, and self-remove reviewed payloads
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          LARGE_B64_SHA256: 5c54fc6c291a3553e19507569a7d653e0c136e2671d4ecd4c59f2a15eb6a1d36
          LARGE_TGZ_SHA256: 77b1e1a077962529f508aae4a384881b53b59900db5625a9c4bd56c1c7308921
          SMALL_B64_SHA256: c4a984b03a626c93e9c547ee55e33266e3e78db272476c221a54dc147fb968b0
          SMALL_TGZ_SHA256: ace4eb192815052d3c91a94fc0389ba1a0cdb11c750d9435465707c9368a4a44
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$HEAD_BRANCH" = "agent/pos-workforce-security-20260727"

          cat .agent/pos-large.part-* > /tmp/pos-large.b64
          printf '%s  %s\n' "$LARGE_B64_SHA256" /tmp/pos-large.b64 | sha256sum --check --strict
          base64 --decode /tmp/pos-large.b64 > /tmp/pos-large.tgz
          printf '%s  %s\n' "$LARGE_TGZ_SHA256" /tmp/pos-large.tgz | sha256sum --check --strict

          cat .agent/pos-small.part-* > /tmp/pos-small.b64
          printf '%s  %s\n' "$SMALL_B64_SHA256" /tmp/pos-small.b64 | sha256sum --check --strict
          base64 --decode /tmp/pos-small.b64 > /tmp/pos-small.tgz
          printf '%s  %s\n' "$SMALL_TGZ_SHA256" /tmp/pos-small.tgz | sha256sum --check --strict

          {
            tar -tzf /tmp/pos-large.tgz
            tar -tzf /tmp/pos-small.tgz
          } | sed 's#^\./##' | sort > /tmp/actual-manifest
          cat > /tmp/expected-manifest <<'EOF'
          app/business/[businessSlug]/pos-security/page.tsx
          components/business/BusinessPosSecurityManager.tsx
          lib/security-hardening.test.ts
          supabase/functions/business-pos-security/index.ts
          supabase/migrations/20260727043000_pos_workforce_security.sql
          supabase/tests/business_pos_security.sql
          tests/business-pos-security-contract.test.ts
          EOF
          sort -o /tmp/expected-manifest /tmp/expected-manifest
          diff -u /tmp/expected-manifest /tmp/actual-manifest

          tar -xzf /tmp/pos-large.tgz
          tar -xzf /tmp/pos-small.tgz

          cat > /tmp/expected-sha256 <<'EOF'
          41b8b3743c417a604e2ef6f4d85b8fd4716774ca4a4d99e7cee19b6cda1d9e15  .env.example
          ea7a8e6821a1d783b5b686b33b94ae1c7f026f7694fcb876ff5648917bc49e1c  .github/workflows/ci.yml
          ee0c6a40740df52c5bdc4f82326790618243b2d82d292678c14cbafced9aa055  app/business/[businessSlug]/pos-security/page.tsx
          90b3aeaad4de22a41c89d7668ec0ab50be5b3cdf76fb4112cc5bf2a091409459  components/business/BusinessPosSecurityManager.tsx
          bf0a477b0b648483fdb6bcb36f6e457edca4688364b8fde1c126022e698238bc  lib/security-hardening.test.ts
          87bac9da4097e3cc0377b2589eb2aeb105ad7585e4c6340eee9248ad4ad0ccfa  supabase/functions/business-pos-security/index.ts
          6a4f7330ebd888522799fde4e2b3cf12173d2e31a29f0c1c82a665b0c25d9873  supabase/migrations/20260727043000_pos_workforce_security.sql
          53d2c17c58e029333cd50b0ecd69ab7425d8cf80aeef6851314f19d2d97dbce0  supabase/tests/business_pos_security.sql
          9f29b922dee43daffc8e315bf5aacc042c81dd16927a0ca2983e201c63df2cba  tests/business-pos-security-contract.test.ts
          EOF
          sha256sum --check --strict /tmp/expected-sha256

          rm -f .agent/pos-large.part-* .agent/pos-small.part-* .github/workflows/agent-apply-pos.yml
          rmdir .agent 2>/dev/null || true

          git add -A -- \
            .agent \
            .env.example \
            .github/workflows/agent-apply-pos.yml \
            .github/workflows/ci.yml \
            'app/business/[businessSlug]/pos-security/page.tsx' \
            components/business/BusinessPosSecurityManager.tsx \
            lib/security-hardening.test.ts \
            supabase/functions/business-pos-security/index.ts \
            supabase/migrations/20260727043000_pos_workforce_security.sql \
            supabase/tests/business_pos_security.sql \
            tests/business-pos-security-contract.test.ts

          test -n "$(git status --porcelain)"
          git config user.name "jalvoro-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Retail POS workforce security foundation"
          git push origin "HEAD:$HEAD_BRANCH"
