name: Export deployable Command Center source

on:
  push:
    branches:
      - agent/global-command-center-launch-polish
    paths:
      - .github/workflows/export-command-center-deploy-source.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Prepare deployable runtime source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/export-command-center-deploy-source.yml
          printf 'run_id=%s\nsource_commit=%s\nartifact=command-center-deploy-source-%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > docs/command-center-source-export.txt
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.next \
            --exclude=.vercel \
            --exclude=node_modules \
            --exclude=docs \
            --exclude=android-twa \
            --exclude=supabase \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            --exclude='*.spec.ts' \
            --exclude='*.spec.tsx' \
            --exclude='*.log' \
            --exclude=package.json \
            -czf /tmp/jalvoro-command-center-deploy-source.tar.gz .
          sha256sum /tmp/jalvoro-command-center-deploy-source.tar.gz > /tmp/source-sha256.txt
          stat --printf='bytes=%s\n' /tmp/jalvoro-command-center-deploy-source.tar.gz >> /tmp/source-sha256.txt

      - name: Upload deployable source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-center-deploy-source-${{ github.run_id }}
          path: |
            /tmp/jalvoro-command-center-deploy-source.tar.gz
            /tmp/source-sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Record export and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record deployable Command Center source export"
          git push origin HEAD:agent/global-command-center-launch-polish
