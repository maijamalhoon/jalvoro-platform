name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: /language:javascript-typescript

  private-repository-security:
    name: Private repository security gate
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.event.repository.private == true
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Enable Windows long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify installed Node.js
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          node --version
          npm --version
          $major = node -p "Number(process.versions.node.split('.')[0])"
          if ([int]$major -ne 24) {
            throw "Node.js 24 is required; found major version $major."
          }

      - name: Install dependencies
        run: npm ci --silent

      - name: Enforce dependency audit policy
        run: npm run audit:ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run security contract tests
        run: npx vitest run lib/security-hardening.test.ts

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
