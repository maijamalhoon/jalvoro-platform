name: Fix POS operations security contract

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-fix-pos-operations-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pos-operations-bridge-20260727' &&
      github.event.pull_request.base.ref == 'agent/pos-sale-bridge-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact POS operations head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Move end-shift assertion and self-remove
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/security-hardening.test.ts")
          source = path.read_text()
          assertion = '    expect(migration).toContain("public.end_business_pos_session");\n'
          if source.count(assertion) != 1:
              raise SystemExit("Expected one stale end-shift assertion")
          source = source.replace(assertion, "", 1)
          block = (
              '    expect(migration).toContain("private.get_business_pos_session_internal");\n'
              '    expect(migration).toContain("public.consume_business_pos_approval(");\n'
          )
          replacement = (
              '    expect(migration).toContain("private.get_business_pos_session_internal");\n'
              '    expect(migration).toContain("public.end_business_pos_session");\n'
              '    expect(migration).toContain("public.consume_business_pos_approval(");\n'
          )
          if source.count(block) != 1:
              raise SystemExit("Expected one POS operations assertion block")
          updated = source.replace(block, replacement, 1)
          if updated.count("public.end_business_pos_session") != 1:
              raise SystemExit("End-shift assertion was not moved exactly once")
          path.write_text(updated)
          PY

          rm -f .github/workflows/agent-fix-pos-operations-contract.yml
          git add -- lib/security-hardening.test.ts .github/workflows/agent-fix-pos-operations-contract.yml
          git diff --cached --check
          git config user.name 'jalvoro-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix POS operations security contract'
          git push origin "HEAD:$HEAD_BRANCH"
