name: Materialize verified Command Center migrations

on:
  push:
    branches:
      - agent/command-center-registry-control-plane

permissions:
  contents: write

concurrency:
  group: command-center-registry-materialize
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out registry branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/command-center-registry-control-plane
          fetch-depth: 0

      - name: Write staging-verified migration files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          printf '%s' '' | base64 --decode | gzip --decompress > supabase/migrations/20260724133222_command_center_registry_control_plane.sql
          printf '%s' '' | base64 --decode | gzip --decompress > supabase/migrations/20260724133646_index_command_center_registry_foreign_keys.sql
          rm .github/workflows/command-center-registry-materialize.yml
          git diff --check
          test "$(sha256sum supabase/migrations/20260724133222_command_center_registry_control_plane.sql | cut -d' ' -f1)" = "89a1c2bacb38db428239e81e9dc85d5944f212433f833361c115374f3a4bf234"
          test "$(sha256sum supabase/migrations/20260724133646_index_command_center_registry_foreign_keys.sql | cut -d' ' -f1)" = "78478fcf8e0584b1625da2a33b675ffcf6f99e1bd912df1c157a5143db144009"

      - name: Commit verified migrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260724133222_command_center_registry_control_plane.sql \
            supabase/migrations/20260724133646_index_command_center_registry_foreign_keys.sql \
            .github/workflows/command-center-registry-materialize.yml
          git commit -m "Add Command Center registry migrations"
          git push origin HEAD:agent/command-center-registry-control-plane
