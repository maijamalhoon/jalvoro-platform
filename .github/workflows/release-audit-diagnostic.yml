name: Release audit diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          show-progress: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --silent
      - name: Capture audit diagnostic
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > audit.json
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : {
              title: entry.title,
              severity: entry.severity,
              range: entry.range,
              url: entry.url,
            }),
          }));
          fs.writeFileSync('audit-diagnostic.json', JSON.stringify({metadata: audit.metadata, vulnerabilities: rows}, null, 2));
          NODE
          exit 0
      - name: Upload audit diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-diagnostic
          path: audit-diagnostic.json
          retention-days: 1
          if-no-files-found: error
