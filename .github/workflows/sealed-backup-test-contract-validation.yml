name: Sealed Backup Test Contract Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/data-backup.test.ts"
      - ".github/workflows/sealed-backup-test-contract-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealed-backup-test-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiJ9.build-only-placeholder
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiJ9.build-only-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Sealed backup tests
        run: npx vitest run lib/data-backup.test.ts

      - name: Production build
        run: npm run build
