name: Verify AI multi-currency patch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-ai-multi-currency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: node .github/scripts/patch-ai-multi-currency.mjs
      - name: Verify patch is already applied
        run: |
          git diff --exit-code -- \
            app/api/ai-insights/route.ts \
            app/api/ai-insights/chat/route.ts \
            app/api/ai-insights/exact/route.ts
