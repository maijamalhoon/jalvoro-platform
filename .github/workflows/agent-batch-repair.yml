name: Agent batch repair

on:
  push:
    branches: [agent/final-production-audit-20260726]
    paths: [".github/workflows/agent-batch-repair.yml"]
  pull_request:
    types: [synchronize]
    paths: [".github/workflows/agent-batch-repair.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Check out audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/final-production-audit-20260726
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Restore and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          git show 0cb471d6eaea43006af6e4b93a19acab330bc46c:.github/workflows/agent-batch-repair.yml > /tmp/verified-workflow.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/verified-workflow.yml').read_text()
          marker = "cat > /tmp/audit-fixes.patch.gz.b64 <<'PATCH'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PATCH", start)
          payload = source[start:end]
          payload = "\n".join(line.removeprefix("          ") for line in payload.splitlines())
          Path('/tmp/audit-fixes.patch.gz.b64').write_text(payload + "\n")
          PY
          base64 --decode /tmp/audit-fixes.patch.gz.b64 | gzip --decompress > /tmp/audit-fixes.patch
          patch --batch --forward -p1 < /tmp/audit-fixes.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('components/ui/date-picker.tsx')
          source = path.read_text()
          source = source.replace(
              "  openCalendar,\n  calendarOpen,\n  calendarId,\n",
              "  openCalendar,\n",
              1,
          )
          source = source.replace(
              "  openCalendar: () => void;\n  calendarOpen: boolean;\n  calendarId: string;\n",
              "  openCalendar: () => void;\n",
              1,
          )
          source = source.replace(
              "            openCalendar={openCalendar}\n            calendarOpen={calendarOpen}\n            calendarId={calendarId}\n",
              "            openCalendar={openCalendar}\n",
              1,
          )
          path.write_text(source)
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci --silent

      - name: Run retained verification
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p .repair-logs
          npx eslint --max-warnings=0 2>&1 | tee .repair-logs/lint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee .repair-logs/typecheck.log
          type_code=${PIPESTATUS[0]}
          printf 'lint=%s\ntypecheck=%s\n' "$lint_code" "$type_code" | tee .repair-logs/status.txt
          echo "lint_code=$lint_code" >> "$GITHUB_OUTPUT"
          echo "type_code=$type_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-batch-repair-diagnostics
          path: .repair-logs
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2

      - name: Commit repaired source
        if: steps.verify.outputs.lint_code == '0' && steps.verify.outputs.type_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI production audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components next.config.ts
          git commit -m "fix: resolve production lint and runtime warnings"
          git pull --rebase origin agent/final-production-audit-20260726
          git push origin HEAD:agent/final-production-audit-20260726

      - name: Fail incomplete repair
        if: steps.verify.outputs.lint_code != '0' || steps.verify.outputs.type_code != '0'
        run: exit 1
