name: Apply exact POS sale semantic fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-pos-sale-semantic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pos-sale-bridge-20260727' &&
      github.event.pull_request.base.ref == 'agent/pos-workforce-security-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact sale bridge head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Patch exact semantic edge cases and self-remove
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20260727060000_pos_sale_transaction_bridge.sql")
          source = migration.read_text()
          replacements = [
            (
              "  if jsonb_typeof(p_lines)<>'array' or jsonb_array_length(p_lines) not between 1 and 100 then\n    raise exception 'POS sale requires 1 to 100 lines.' using errcode='22023';\n  end if;",
              "  if p_lines is null\n     or jsonb_typeof(p_lines)<>'array'\n     or jsonb_array_length(p_lines) not between 1 and 100 then\n    raise exception 'POS sale requires 1 to 100 lines.' using errcode='22023';\n  end if;",
            ),
            (
              "    if jsonb_typeof(item->'quantity')<>'number'\n       or (item ? 'discount_percent' and jsonb_typeof(item->'discount_percent')<>'number')",
              "    if not (item ? 'quantity')\n       or jsonb_typeof(item->'quantity')<>'number'\n       or (item ? 'discount_percent' and jsonb_typeof(item->'discount_percent')<>'number')",
            ),
            (
              """    if existing_request.status='posted' then
              perform private.write_business_pos_event(
                target_session.business_id,target_session.branch_id,target_session.device_id,
                target_session.id,target_session.user_id,target_session.user_id,
                existing_request.approval_id,'sale_replayed','success',
                jsonb_build_object('request_id',existing_request.id,'invoice_id',existing_request.invoice_id)
              );
              return coalesce(existing_request.result,'{}'::jsonb)||jsonb_build_object('replayed',true);
            end if;
            if existing_request.attempt_count>=5 then""",
              """    if existing_request.status='posted' then
              perform private.write_business_pos_event(
                target_session.business_id,target_session.branch_id,target_session.device_id,
                target_session.id,target_session.user_id,target_session.user_id,
                existing_request.approval_id,'sale_replayed','success',
                jsonb_build_object('request_id',existing_request.id,'invoice_id',existing_request.invoice_id)
              );
              return coalesce(existing_request.result,'{}'::jsonb)||jsonb_build_object('replayed',true);
            end if;
            if existing_request.status='approval_required' and p_approval_id is null then
              return jsonb_build_object(
                'ok',false,'approval_required',true,'operation_type','high_discount',
                'payload_hash',payload_hash,'request_id',existing_request.id,
                'amount',estimated_total,'discount_percent',max_discount
              );
            end if;
            if existing_request.attempt_count>=5 then""",
            ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit("Expected exactly one migration semantic replacement target")
              source = source.replace(old, new)
          migration.write_text(source)

          regression = Path("supabase/tests/business_pos_sale_bridge.sql")
          source = regression.read_text()
          old = "declare state pos_sale_state; required jsonb; approval jsonb; posted jsonb;"
          new = "declare state pos_sale_state; required jsonb; waiting jsonb; approval jsonb; posted jsonb; retry_number integer; recorded_attempts smallint;"
          if source.count(old) != 1:
              raise SystemExit("Expected one regression declaration target")
          source = source.replace(old, new)
          old = """  if not coalesce((required->>'approval_required')::boolean,false) then
            raise exception 'High discount POS sale posted without approval.';
          end if;
          update pos_sale_state set payload_hash=required->>'payload_hash';

          approval:=public.create_business_pos_approval_request("""
          new = """  if not coalesce((required->>'approval_required')::boolean,false) then
            raise exception 'High discount POS sale posted without approval.';
          end if;
          update pos_sale_state set payload_hash=required->>'payload_hash';

          for retry_number in 1..5 loop
            waiting:=public.post_business_pos_sale(
              encode(extensions.digest('sale-session-token','sha256'),'hex'),
              (now() at time zone 'Asia/Karachi')::date,null,
              jsonb_build_array(jsonb_build_object(
                'product_id',state.product_id,'quantity',1,'discount_percent',20,'tax_rate',0
              )),true,'Manager-approved discount','75555555-5555-4555-8555-555555555555',null
            );
            if not coalesce((waiting->>'approval_required')::boolean,false) then
              raise exception 'Waiting POS approval request stopped returning approval context.';
            end if;
          end loop;
          select request.attempt_count into recorded_attempts
          from public.business_pos_sale_requests request
          where request.business_id=state.business_id
            and request.request_key='75555555-5555-4555-8555-555555555555';
          if recorded_attempts<>1 then
            raise exception 'Waiting for approval incremented the POS posting retry counter.';
          end if;

          approval:=public.create_business_pos_approval_request("""
          if source.count(old) != 1:
              raise SystemExit("Expected one approval regression insertion target")
          regression.write_text(source.replace(old, new))

          contract = Path("tests/business-pos-sale-bridge-contract.test.ts")
          source = contract.read_text()
          replacements = [
            (
              '    expect(migration).toContain("contains unsupported fields");\n    expect(edgeFunction).not.toContain("unit_price:");',
              '    expect(migration).toContain("contains unsupported fields");\n    expect(migration).toContain("if p_lines is null");\n    expect(migration).toContain("if not (item ? \'quantity\')");\n    expect(edgeFunction).not.toContain("unit_price:");',
            ),
            (
              '    expect(migration).toContain("existing_request.session_id<>target_session.id");\n    expect(migration).toContain("public.consume_business_pos_approval(");',
              '    expect(migration).toContain("existing_request.session_id<>target_session.id");\n    expect(migration).toContain("existing_request.status=\'approval_required\' and p_approval_id is null");\n    expect(migration).toContain("public.consume_business_pos_approval(");',
            ),
            (
              '    expect(regression).toContain("High discount POS sale posted without approval");\n    expect(regression).toContain("rollback;");',
              '    expect(regression).toContain("High discount POS sale posted without approval");\n    expect(regression).toContain("Waiting for approval incremented the POS posting retry counter");\n    expect(regression).toContain("rollback;");',
            ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit("Expected exactly one contract replacement target")
              source = source.replace(old, new)
          contract.write_text(source)
          PY

          cat > /tmp/expected-sha256 <<'EOF'
          6a0c8451cb195c8d6856826bf205d4d53052d4a2ef7e8a69a3b1debefcb73eb1  supabase/migrations/20260727060000_pos_sale_transaction_bridge.sql
          feed3b929bb01f7ce5556bfd5837ad1f8a79da0a0e4cd99655a80ab9857bbd06  supabase/tests/business_pos_sale_bridge.sql
          e6409e9eb84203a72eaed7aea26975674892b1be0f3465c8154d77ec56574ada  tests/business-pos-sale-bridge-contract.test.ts
          EOF
          sha256sum --check --strict /tmp/expected-sha256

          rm -f .github/workflows/agent-fix-pos-sale-semantics.yml
          git add -- \
            .github/workflows/agent-fix-pos-sale-semantics.yml \
            supabase/migrations/20260727060000_pos_sale_transaction_bridge.sql \
            supabase/tests/business_pos_sale_bridge.sql \
            tests/business-pos-sale-bridge-contract.test.ts
          test -n "$(git status --porcelain)"
          git diff --cached --check
          git config user.name "jalvoro-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden POS sale approval retry semantics"
          git push origin "HEAD:$HEAD_BRANCH"
