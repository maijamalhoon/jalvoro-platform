name: Export frozen Command Center standalone build

on:
  push:
    branches:
      - ops/command-center-local-acceptance
    paths:
      - .github/workflows/export-frozen-command-center-standalone.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://tdagzmgcgjlyqzegmizg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkYWd6bWdjZ2pseXF6ZWdtaXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzg1NjQsImV4cCI6MjA5NjkxNDU2NH0.4ix9a51FFsFZgE2zRrg8XQjivWGTeLWnP8z8yAQwQhQ
      NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
    steps:
      - name: Check out operations branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ops
          fetch-depth: 1
          persist-credentials: true

      - name: Check out immutable release SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fc0ee9538f6036904c71c999740834f9d0490bb1
          path: release
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare operations cleanup and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f ops/.github/workflows/export-frozen-command-center-standalone.yml
          mkdir -p ops/docs
          printf 'run_id=%s\nrelease_sha=fc0ee9538f6036904c71c999740834f9d0490bb1\nartifact=command-center-frozen-standalone-%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ID" \
            > ops/docs/command-center-frozen-standalone-export.txt

      - name: Enable standalone packaging only
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('next.config.ts')
          text = path.read_text()
          marker = 'const nextConfig: NextConfig = {\n'
          if marker not in text:
              raise SystemExit('nextConfig marker not found')
          path.write_text(text.replace(marker, marker + '  output: "standalone",\n', 1))
          PY

      - name: Install dependencies
        working-directory: release
        run: npm ci --silent

      - name: Build frozen production application
        working-directory: release
        run: npm run build

      - name: Assemble runnable bundle
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          printf '%s\n' 'fc0ee9538f6036904c71c999740834f9d0490bb1' > .next/standalone/COMMAND_CENTER_SOURCE_HEAD
          tar -C .next/standalone -czf /tmp/command-center-frozen-standalone.tar.gz .
          sha256sum /tmp/command-center-frozen-standalone.tar.gz > /tmp/standalone-sha256.txt
          stat --printf='bytes=%s\n' /tmp/command-center-frozen-standalone.tar.gz >> /tmp/standalone-sha256.txt

      - name: Upload runnable frozen build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-center-frozen-standalone-${{ github.run_id }}
          path: |
            /tmp/command-center-frozen-standalone.tar.gz
            /tmp/standalone-sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Record result and remove one-shot workflow
        if: always()
        working-directory: ops
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record frozen Command Center standalone build"
          git push origin HEAD:ops/command-center-local-acceptance
