name: Finance parity contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/finance-parity/**"
      - "lib/analytics/**"
      - "lib/currency.ts"
      - "lib/investments/**"
      - "lib/planning/**"
      - "lib/finance-parity-contract.test.ts"
      - "native/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/finance-parity-pr-ci.yml"

permissions:
  contents: read

concurrency:
  group: finance-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  website-and-native-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify installed Node.js
        run: |
          $ErrorActionPreference = "Stop"
          $nodeDir = Join-Path $env:ProgramFiles "nodejs"
          $nodeExe = Join-Path $nodeDir "node.exe"
          $npmCmd = Join-Path $nodeDir "npm.cmd"
          if (-not (Test-Path $nodeExe) -or -not (Test-Path $npmCmd)) {
            throw "Node.js is not installed at $nodeDir. Install the current Node.js LTS package on the self-hosted runner."
          }
          $nodeDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nodeExe --version
          & $npmCmd --version

      - name: Install website dependencies
        run: '& "$env:ProgramFiles\nodejs\npm.cmd" ci --silent'

      - name: Run website finance parity contract
        run: '& "$env:ProgramFiles\nodejs\npm.cmd" run test:parity'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run native finance parity contract
        working-directory: native
        run: |
          $ErrorActionPreference = "Continue"
          & gradle :shared:testAndroidHostTest --stacktrace 2>&1 | Tee-Object -FilePath finance-parity-native.log
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) {
            exit $gradleExitCode
          }

      - name: Upload parity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-parity-log-${{ github.run_id }}
          path: native/finance-parity-native.log
          if-no-files-found: ignore
          retention-days: 3
