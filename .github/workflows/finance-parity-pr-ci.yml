name: Finance parity contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/finance-parity/**"
      - "lib/analytics/**"
      - "lib/currency.ts"
      - "lib/investments/**"
      - "lib/planning/**"
      - "lib/finance-parity-contract.test.ts"
      - "native/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/finance-parity-pr-ci.yml"
      - ".github/scripts/setup-android-sdk.ps1"

permissions:
  contents: read

concurrency:
  group: finance-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  website-and-native-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify installed Node.js
        run: |
          node.exe --version
          npm.cmd --version

      - name: Install website dependencies
        run: npm.cmd ci --silent

      - name: Run website finance parity contract
        run: npm.cmd run test:parity

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        run: '& "$env:GITHUB_WORKSPACE\.github\scripts\setup-android-sdk.ps1"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run native finance parity contract
        working-directory: native
        run: |
          $ErrorActionPreference = "Continue"
          & gradle :shared:testAndroidHostTest --stacktrace 2>&1 | Tee-Object -FilePath finance-parity-native.log
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) {
            exit $gradleExitCode
          }

      - name: Upload parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-parity-log-${{ github.run_id }}
          path: |
            native/finance-parity-native.log
            native/android-sdk-setup.log
          if-no-files-found: ignore
          retention-days: 3
