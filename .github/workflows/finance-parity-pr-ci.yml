name: Finance parity contract

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/finance-parity/**"
      - "lib/analytics/**"
      - "lib/currency.ts"
      - "lib/investments/**"
      - "lib/planning/**"
      - "lib/finance-parity-contract.test.ts"
      - "native/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/finance-parity-pr-ci.yml"

permissions:
  contents: read

concurrency:
  group: finance-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  website-and-native-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Node.js 24
        run: |
          $ErrorActionPreference = "Stop"
          $node = Get-Command node.exe -ErrorAction SilentlyContinue
          $npm = Get-Command npm.cmd -ErrorAction SilentlyContinue
          if (-not $node -or -not $npm) {
            $release = Invoke-RestMethod "https://nodejs.org/dist/index.json" |
              Where-Object { $_.version -like "v24.*" -and $_.files -contains "win-x64-msi" } |
              Select-Object -First 1
            if (-not $release) { throw "No official Node.js 24 Windows x64 MSI release was found." }
            $msi = Join-Path $env:RUNNER_TEMP "node-$($release.version)-x64.msi"
            Invoke-WebRequest "https://nodejs.org/dist/$($release.version)/node-$($release.version)-x64.msi" -OutFile $msi
            $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Node.js installer failed with exit code $($process.ExitCode)." }
            "C:\Program Files\nodejs" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:Path = "C:\Program Files\nodejs;$env:Path"
          }
          node.exe --version
          npm.cmd --version

      - name: Install website dependencies
        run: npm.cmd ci --silent

      - name: Run website finance parity contract
        run: npm.cmd run test:parity

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager.bat "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run native finance parity contract
        working-directory: native
        run: |
          $ErrorActionPreference = "Continue"
          & gradle :shared:testAndroidHostTest --stacktrace 2>&1 | Tee-Object -FilePath finance-parity-native.log
          $gradleExitCode = $LASTEXITCODE
          if ($gradleExitCode -ne 0) {
            exit $gradleExitCode
          }

      - name: Upload parity diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-parity-log-${{ github.run_id }}
          path: native/finance-parity-native.log
          if-no-files-found: ignore
          retention-days: 3
