name: Agent lint repair

on:
  pull_request:
    types: [synchronize]
    paths: [".github/workflows/agent-lint-repair.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/final-production-audit-20260726
          fetch-depth: 0
          show-progress: false

      - name: Repair callback dependency contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/ai-insights/AIInsightsExplainablePanel.tsx")
          source = path.read_text()
          source = source.replace(
              "  const unavailableMessage = copy.panel.unavailable;\n  const emptyServerMessage = copy.server.emptyMessage;\n",
              "",
              1,
          )
          source = source.replace("body.message ?? unavailableMessage", "body.message ?? copy.panel.unavailable")
          source = source.replace("body.message ?? emptyServerMessage", "body.message ?? copy.server.emptyMessage")
          source = source.replace(": unavailableMessage,", ": copy.panel.unavailable,")
          source = source.replace(
              "[currency, emptyServerMessage, language, live, rate, unavailableMessage]",
              "[copy, currency, language, live, rate]",
              1,
          )
          path.write_text(source)

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI production audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ai-insights/AIInsightsExplainablePanel.tsx
          git commit -m "fix: preserve AI insight callback memoization"
          git push origin HEAD:agent/final-production-audit-20260726
