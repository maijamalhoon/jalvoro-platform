name: Native pull request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-pr-ci.yml"

permissions:
  contents: write

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply Overview, Money and Settings parity pass
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()
          touched = []

          def replace_once(path, old, new):
              file = ROOT / path
              data = file.read_text()
              if new in data:
                  return
              if old not in data:
                  raise SystemExit(f"Expected source block not found in {path}: {old[:100]!r}")
              file.write_text(data.replace(old, new, 1))
              touched.append(path)

          def edit(path, transform):
              file = ROOT / path
              data = file.read_text()
              updated = transform(data)
              if updated == data:
                  return
              file.write_text(updated)
              touched.append(path)

          motion = "native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroNativeMotion.kt"
          replace_once(motion, "    val staggerMillis: Int get() = scaled(12)\n    val delayMillis: Int get() = scaled(6)", "    // Mirrors the website's short 0/35/70/105 ms entrance cascade.\n    val staggerMillis: Int get() = scaled(35)\n    val delayMillis: Int get() = scaled(0)\n    val entranceMillis: Int get() = scaled(320)")
          replace_once(motion, "(delayMillis + staggerMillis * index.coerceAtLeast(0)).toLong()", "(delayMillis + staggerMillis * index.coerceIn(0, 3)).toLong()")
          replace_once(motion, "val offsetPx = with(LocalDensity.current) { 5.dp.toPx() }", "val offsetPx = with(LocalDensity.current) { 10.dp.toPx() }")
          def motion_duration(data):
              start = data.index("    val alpha by animateFloatAsState(")
              end = data.index("    Box(\n", start)
              segment = data[start:end]
              segment = segment.replace("durationMillis = motion.fastMillis", "durationMillis = motion.entranceMillis")
              if segment.count("durationMillis = motion.entranceMillis") != 2:
                  raise SystemExit("Entrance duration replacement count was not two")
              return data[:start] + segment + data[end:]
          edit(motion, motion_duration)

          overview = "native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt"
          replace_once(overview, "import androidx.compose.foundation.lazy.items\n", "import androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.lazy.itemsIndexed\n")
          replace_once(overview, "                item {\n                    OverviewGreeting(email = email)\n                }", "                item {\n                    JalvoroEntrance(index = 0, key = \"overview-greeting\") {\n                        OverviewGreeting(email = email)\n                    }\n                }")
          replace_once(overview, "                    item {\n                        OverviewDataNotice(messages = failures)\n                    }", "                    item {\n                        JalvoroEntrance(index = 1, key = failures.joinToString(\"|\")) {\n                            OverviewDataNotice(messages = failures)\n                        }\n                    }")
          replace_once(overview, "                    item {\n                        OverviewBalanceHero(\n                            totalBalance = totalBalance,\n                            accountBalance = accountBalance,\n                            portfolioValue = portfolioValue,\n                            onOpenFinance = onOpenFinance,\n                            onOpenInvestments = onOpenInvestments,\n                        )\n                    }", "                    item {\n                        JalvoroEntrance(index = 2, key = \"overview-balance\") {\n                            OverviewBalanceHero(\n                                totalBalance = totalBalance,\n                                accountBalance = accountBalance,\n                                portfolioValue = portfolioValue,\n                                onOpenFinance = onOpenFinance,\n                                onOpenInvestments = onOpenInvestments,\n                            )\n                        }\n                    }\n\n                    item {\n                        JalvoroEntrance(index = 3, key = \"overview-month-heading\") {\n                            OverviewSectionHeading(\n                                title = \"This month\",\n                                description = \"Month-to-date totals use the same refund and savings rules as the website.\",\n                            )\n                        }\n                    }")
          replace_once(overview, "                    items(\n                        items = if (twoColumns) metrics.chunked(2) else metrics.map(::listOf),\n                        key = { row -> row.joinToString(\"|\") { it.title } },\n                    ) { row ->\n                        Row(\n                            modifier = Modifier.fillMaxWidth(),\n                            horizontalArrangement = Arrangement.spacedBy(12.dp),\n                        ) {\n                            row.forEach { metric ->\n                                OverviewMetricCard(\n                                    metric = metric,\n                                    modifier = Modifier.weight(1f),\n                                )\n                            }\n                            if (twoColumns && row.size == 1) Spacer(Modifier.weight(1f))\n                        }\n                    }", "                    val metricRows = if (twoColumns) metrics.chunked(2) else metrics.map(::listOf)\n                    itemsIndexed(\n                        items = metricRows,\n                        key = { _, row -> row.joinToString(\"|\") { it.title } },\n                    ) { rowIndex, row ->\n                        JalvoroEntrance(\n                            index = 4 + rowIndex,\n                            key = row.joinToString(\"|\") { \"${it.title}:${it.amount}\" },\n                        ) {\n                            Row(\n                                modifier = Modifier.fillMaxWidth(),\n                                horizontalArrangement = Arrangement.spacedBy(12.dp),\n                            ) {\n                                row.forEach { metric ->\n                                    OverviewMetricCard(\n                                        metric = metric,\n                                        modifier = Modifier.weight(1f),\n                                    )\n                                }\n                                if (twoColumns && row.size == 1) Spacer(Modifier.weight(1f))\n                            }\n                        }\n                    }")
          replace_once(overview, "                    item {\n                        OverviewSectionHeading(\n                            title = \"Your workspaces\",\n                            description = \"Open the same finance areas available on the website.\",\n                        )\n                    }", "                    item {\n                        JalvoroEntrance(index = 6, key = \"overview-workspaces-heading\") {\n                            OverviewSectionHeading(\n                                title = \"Your workspaces\",\n                                description = \"Open the same finance areas available on the website.\",\n                            )\n                        }\n                    }")
          replace_once(overview, "                    items(\n                        items = if (twoColumns) actions.chunked(2) else actions.map(::listOf),\n                        key = { row -> row.joinToString(\"|\") { it.title } },\n                    ) { row ->\n                        Row(\n                            modifier = Modifier.fillMaxWidth(),\n                            horizontalArrangement = Arrangement.spacedBy(12.dp),\n                        ) {\n                            row.forEach { action ->\n                                OverviewActionCard(\n                                    action = action,\n                                    modifier = Modifier.weight(1f),\n                                )\n                            }\n                            if (twoColumns && row.size == 1) Spacer(Modifier.weight(1f))\n                        }\n                    }", "                    val actionRows = if (twoColumns) actions.chunked(2) else actions.map(::listOf)\n                    itemsIndexed(\n                        items = actionRows,\n                        key = { _, row -> row.joinToString(\"|\") { it.title } },\n                    ) { rowIndex, row ->\n                        JalvoroEntrance(\n                            index = 7 + rowIndex,\n                            key = row.joinToString(\"|\") { it.title },\n                        ) {\n                            Row(\n                                modifier = Modifier.fillMaxWidth(),\n                                horizontalArrangement = Arrangement.spacedBy(12.dp),\n                            ) {\n                                row.forEach { action ->\n                                    OverviewActionCard(\n                                        action = action,\n                                        modifier = Modifier.weight(1f),\n                                    )\n                                }\n                                if (twoColumns && row.size == 1) Spacer(Modifier.weight(1f))\n                            }\n                        }\n                    }")
          replace_once(overview, "                    item {\n                        OverviewGoalsCard(\n                            snapshot = goalsSnapshot,\n                            onOpenPlanning = onOpenPlanning,\n                        )\n                    }", "                    item {\n                        JalvoroEntrance(index = 9, key = \"overview-goals:${goalsSnapshot?.goals?.size}\") {\n                            OverviewGoalsCard(\n                                snapshot = goalsSnapshot,\n                                onOpenPlanning = onOpenPlanning,\n                            )\n                        }\n                    }")
          replace_once(overview, "                    item {\n                        OverviewRecentActivity(\n                            entries = recentEntries,\n                            dataAvailable = financeSnapshot != null,\n                            onOpenFinance = onOpenFinance,\n                        )\n                    }", "                    item {\n                        JalvoroEntrance(index = 10, key = \"overview-recent:${recentEntries.joinToString { it.id }}\") {\n                            OverviewRecentActivity(\n                                entries = recentEntries,\n                                dataAvailable = financeSnapshot != null,\n                                onOpenFinance = onOpenFinance,\n                            )\n                        }\n                    }")
          replace_once(overview, "                    Text(\n                        text = formatPkrOrUnavailable(totalBalance),\n                        style = MaterialTheme.typography.headlineLarge,\n                        fontWeight = FontWeight.Bold,\n                    )", "                    JalvoroAnimatedSwap(\n                        targetState = formatPkrOrUnavailable(totalBalance),\n                        label = \"overview-total-balance\",\n                    ) { value ->\n                        Text(\n                            text = value,\n                            style = MaterialTheme.typography.headlineLarge,\n                            fontWeight = FontWeight.Bold,\n                        )\n                    }")
          replace_once(overview, "            Text(\n                text = formatPkrOrUnavailable(metric.amount),\n                style = MaterialTheme.typography.titleLarge,\n                fontWeight = FontWeight.Bold,\n                maxLines = 1,\n                overflow = TextOverflow.Ellipsis,\n            )", "            JalvoroAnimatedSwap(\n                targetState = formatPkrOrUnavailable(metric.amount),\n                label = \"overview-${metric.title}-amount\",\n            ) { value ->\n                Text(\n                    text = value,\n                    style = MaterialTheme.typography.titleLarge,\n                    fontWeight = FontWeight.Bold,\n                    maxLines = 1,\n                    overflow = TextOverflow.Ellipsis,\n                )\n            }")
          replace_once(overview, "                LinearProgressIndicator(\n                    progress = { overallProgress.toFloat() },", "                val animatedOverallProgress = rememberJalvoroAnimatedProgress(\n                    target = overallProgress.toFloat(),\n                    label = \"overview-goals-progress\",\n                )\n                LinearProgressIndicator(\n                    progress = { animatedOverallProgress },")
          replace_once(overview, "                snapshot.goals.take(3).forEach { goal ->\n                    Row(", "                snapshot.goals.take(3).forEachIndexed { index, goal ->\n                    JalvoroEntrance(index = index, key = \"overview-goal-${goal.row.id}:${goal.progress}\") {\n                        Row(")
          replace_once(overview, "                        )\n                    }\n                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun OverviewRecentActivity", "                        )\n                    }\n                    }\n                }\n            }\n        }\n    }\n}\n\n@Composable\nprivate fun OverviewRecentActivity")
          replace_once(overview, "                else -> entries.forEachIndexed { index, entry ->\n                    RecentActivityRow(entry = entry)\n                    if (index != entries.lastIndex) {", "                else -> entries.forEachIndexed { index, entry ->\n                    JalvoroEntrance(index = index, key = \"recent-${entry.type}-${entry.id}\") {\n                        RecentActivityRow(entry = entry)\n                    }\n                    if (index != entries.lastIndex) {")

          money = "native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroFinanceDashboard.kt"
          replace_once(money, "import androidx.compose.foundation.lazy.items\n", "import androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.lazy.itemsIndexed\n")
          replace_once(money, "                snapshot != null -> when (section) {\n                    JalvoroMoneySection.Accounts -> JalvoroAccountsScreen(\n                        snapshot = snapshot,\n                        onEdit = { editAccount = it },\n                        onArchive = { archiveAccount = it },\n                        onTransfer = { transfer = true },\n                    )\n                    JalvoroMoneySection.Transactions -> JalvoroTransactionsScreen(\n                        snapshot = snapshot,\n                        onEdit = { entry ->\n                            scope.launch {\n                                val editable = financeRepository.loadEditableTransaction(entry.id)\n                                if (editable == null) {\n                                    snackbar.showSnackbar(\"Transaction could not be edited.\")\n                                } else {\n                                    editTransaction = editable\n                                }\n                            }\n                        },\n                        onDelete = { deleteEntry = it },\n                    )\n                    JalvoroMoneySection.Profile -> JalvoroFinanceProfile(\n                        email = email,\n                        onSignOut = { scope.launch { onSignOut() } },\n                    )\n                }", "                snapshot != null -> JalvoroAnimatedSwap(\n                    targetState = section,\n                    modifier = Modifier.fillMaxSize(),\n                    label = \"jalvoro-money-section\",\n                ) { currentSection ->\n                    when (currentSection) {\n                        JalvoroMoneySection.Accounts -> JalvoroAccountsScreen(\n                            snapshot = snapshot,\n                            onEdit = { editAccount = it },\n                            onArchive = { archiveAccount = it },\n                            onTransfer = { transfer = true },\n                        )\n                        JalvoroMoneySection.Transactions -> JalvoroTransactionsScreen(\n                            snapshot = snapshot,\n                            onEdit = { entry ->\n                                scope.launch {\n                                    val editable = financeRepository.loadEditableTransaction(entry.id)\n                                    if (editable == null) {\n                                        snackbar.showSnackbar(\"Transaction could not be edited.\")\n                                    } else {\n                                        editTransaction = editable\n                                    }\n                                }\n                            },\n                            onDelete = { deleteEntry = it },\n                        )\n                        JalvoroMoneySection.Profile -> JalvoroFinanceProfile(\n                            email = email,\n                            onSignOut = { scope.launch { onSignOut() } },\n                        )\n                    }\n                }")
          replace_once(money, "            JalvoroBrandLockup(\n                modifier = Modifier.weight(1f),\n                subtitle = when (section) {\n                    JalvoroMoneySection.Accounts -> \"Accounts\"\n                    JalvoroMoneySection.Transactions -> \"Transactions\"\n                    JalvoroMoneySection.Profile -> \"Finance profile\"\n                },\n                compact = true,\n            )", "            JalvoroAnimatedSwap(\n                targetState = when (section) {\n                    JalvoroMoneySection.Accounts -> \"Accounts\"\n                    JalvoroMoneySection.Transactions -> \"Transactions\"\n                    JalvoroMoneySection.Profile -> \"Finance profile\"\n                },\n                modifier = Modifier.weight(1f),\n                label = \"money-header-subtitle\",\n            ) { subtitle ->\n                JalvoroBrandLockup(\n                    modifier = Modifier.fillMaxWidth(),\n                    subtitle = subtitle,\n                    compact = true,\n                )\n            }")
          replace_once(money, "        item {\n            JalvoroSurfaceCard(modifier = Modifier.fillMaxWidth()) {", "        item {\n            JalvoroEntrance(index = 0, key = \"accounts-summary:${snapshot.totalActiveBalance}\") {\n            JalvoroSurfaceCard(modifier = Modifier.fillMaxWidth()) {")
          replace_once(money, "                }\n            }\n        }\n\n        if (snapshot.activeAccounts.isEmpty())", "                }\n            }\n            }\n        }\n\n        if (snapshot.activeAccounts.isEmpty())")
          replace_once(money, "                            Text(\n                                formatPkr(snapshot.totalActiveBalance),\n                                style = MaterialTheme.typography.headlineMedium,\n                                fontWeight = FontWeight.Bold,\n                            )", "                            JalvoroAnimatedSwap(\n                                targetState = formatPkr(snapshot.totalActiveBalance),\n                                label = \"money-total-active-balance\",\n                            ) { value ->\n                                Text(\n                                    value,\n                                    style = MaterialTheme.typography.headlineMedium,\n                                    fontWeight = FontWeight.Bold,\n                                )\n                            }")
          replace_once(money, "            items(snapshot.activeAccounts, key = { it.id }) { account ->\n                JalvoroAccountCard(account, onEdit, onArchive)\n            }", "            itemsIndexed(snapshot.activeAccounts, key = { _, account -> account.id }) { index, account ->\n                JalvoroEntrance(index = index + 1, key = \"active-${account.id}:${account.balance}\") {\n                    JalvoroAccountCard(account, onEdit, onArchive)\n                }\n            }")
          replace_once(money, "                items(snapshot.archivedAccounts, key = { \"archived-${it.id}\" }) { account ->\n                    JalvoroAccountCard(account, onEdit, onArchive)\n                }", "                itemsIndexed(\n                    snapshot.archivedAccounts,\n                    key = { _, account -> \"archived-${account.id}\" },\n                ) { index, account ->\n                    JalvoroEntrance(index = index, key = \"archived-${account.id}:${account.balance}\") {\n                        JalvoroAccountCard(account, onEdit, onArchive)\n                    }\n                }")
          replace_once(money, "                Text(\n                    formatPkr(account.balance),\n                    fontWeight = FontWeight.Bold,\n                )", "                JalvoroAnimatedSwap(\n                    targetState = formatPkr(account.balance),\n                    label = \"account-${account.id}-balance\",\n                ) { value ->\n                    Text(value, fontWeight = FontWeight.Bold)\n                }")
          replace_once(money, "        item {\n            OutlinedTextField(\n                value = query,", "        item {\n            JalvoroEntrance(index = 0, key = \"transaction-search\") {\n            OutlinedTextField(\n                value = query,")
          replace_once(money, "                colors = jalvoroFinanceFieldColors(),\n            )\n        }\n        item {\n            Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {", "                colors = jalvoroFinanceFieldColors(),\n            )\n            }\n        }\n        item {\n            JalvoroEntrance(index = 1, key = \"transaction-filter-${filter.name}\") {\n            Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {")
          replace_once(money, "                }\n            }\n        }\n        if (rows.isEmpty())", "                }\n            }\n            }\n        }\n        if (rows.isEmpty())")
          replace_once(money, "            items(rows, key = { \"${it.type}-${it.id}\" }) { entry ->\n                JalvoroLedgerCard(entry, onEdit, onDelete)\n            }", "            itemsIndexed(rows, key = { _, entry -> \"${entry.type}-${entry.id}\" }) { index, entry ->\n                JalvoroEntrance(\n                    index = index + 2,\n                    key = \"${filter.name}:${query.trim()}:${entry.type}:${entry.id}:${entry.amount}\",\n                ) {\n                    JalvoroLedgerCard(entry, onEdit, onDelete)\n                }\n            }")
          replace_once(money, "                Text(\n                    \"$sign${formatPkr(entry.amount)}\",\n                    fontWeight = FontWeight.Bold,\n                    color = tone,\n                )", "                JalvoroAnimatedSwap(\n                    targetState = \"$sign${formatPkr(entry.amount)}\",\n                    label = \"ledger-${entry.type}-${entry.id}-amount\",\n                ) { value ->\n                    Text(\n                        value,\n                        fontWeight = FontWeight.Bold,\n                        color = tone,\n                    )\n                }")

          settings = "native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroPersonalSettingsScreen.kt"
          replace_once(settings, "import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Column", "import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.BoxWithConstraints\nimport androidx.compose.foundation.layout.Column")
          replace_once(settings, "import androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.fillMaxSize", "import androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth")
          replace_once(settings, "import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.lazy.LazyColumn", "import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.widthIn\nimport androidx.compose.foundation.lazy.LazyColumn")
          replace_once(settings, "import androidx.compose.material3.SnackbarHostState\nimport androidx.compose.material3.Text", "import androidx.compose.material3.SnackbarHostState\nimport androidx.compose.material3.Surface\nimport androidx.compose.material3.Text")
          replace_once(settings, "        topBar = {\n            TopAppBar(\n                navigationIcon = { TextButton(onClick = onBack) { Text(\"Back\") } },\n                title = {\n                    Column {\n                        Text(\n                            \"Personal Settings\",\n                            fontWeight = FontWeight.Bold,\n                            modifier = Modifier.semantics { heading() },\n                        )\n                        Text(\n                            \"JALVORO account and device preferences\",\n                            style = MaterialTheme.typography.labelSmall,\n                            color = MaterialTheme.colorScheme.onSurfaceVariant,\n                        )\n                    }\n                },\n                actions = {\n                    TextButton(\n                        enabled = busy == null,\n                        onClick = {\n                            scope.launch {\n                                busy = \"refresh\"\n                                when (val result = repository.refresh(jalvoroTodayKey(), force = true)) {\n                                    PersonalPlatformResult.Success -> announce(\"Settings refreshed.\")\n                                    is PersonalPlatformResult.Failure -> announce(result.message)\n                                }\n                                busy = null\n                            }\n                        },\n                    ) { Text(\"Refresh\") }\n                },\n            )\n        },", "        topBar = {\n            Surface(\n                color = MaterialTheme.colorScheme.surfaceContainer,\n                shadowElevation = 0.dp,\n            ) {\n                Row(\n                    modifier = Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 9.dp),\n                    verticalAlignment = Alignment.CenterVertically,\n                ) {\n                    JalvoroIconAction(\n                        icon = JalvoroIcons.ArrowLeft,\n                        label = \"Back to overview\",\n                        onClick = onBack,\n                    )\n                    JalvoroBrandLockup(\n                        modifier = Modifier.weight(1f),\n                        subtitle = \"Settings\",\n                        compact = true,\n                    )\n                    JalvoroIconAction(\n                        icon = JalvoroIcons.Refresh,\n                        label = if (busy == \"refresh\") \"Refreshing settings\" else \"Refresh settings\",\n                        enabled = busy == null,\n                        onClick = {\n                            scope.launch {\n                                busy = \"refresh\"\n                                when (val result = repository.refresh(jalvoroTodayKey(), force = true)) {\n                                    PersonalPlatformResult.Success -> announce(\"Settings refreshed.\")\n                                    is PersonalPlatformResult.Failure -> announce(result.message)\n                                }\n                                busy = null\n                            }\n                        },\n                    )\n                }\n            }\n        },")
          old_settings_block = '''            snapshot != null -> {\n                LazyColumn(\n                    modifier = Modifier.fillMaxSize().padding(padding),\n                    contentPadding = PaddingValues(\n                        start = 18.dp,\n                        end = 18.dp,\n                        top = if (localPreferences.compactMode) 8.dp else 16.dp,\n                        bottom = 32.dp,\n                    ),\n                    verticalArrangement = Arrangement.spacedBy(\n                        if (localPreferences.compactMode) 9.dp else 14.dp,\n                    ),\n                ) {\n                    item {\n                        PersonalSettingsSummaryCard(\n                            snapshot = snapshot,\n                            local = localPreferences,\n                        )\n                    }\n                    item { PersonalSectionLabel(\"Profile\") }\n                    item {\n                        PersonalProfileCard(\n                            snapshot = snapshot,\n                            avatarBitmap = avatarBitmap,\n                            busy = busy != null,\n                            onChoosePhoto = {\n                                chooseAvatar.launch(arrayOf(\"image/jpeg\", \"image/png\", \"image/webp\"))\n                            },\n                            onEditName = {\n                                draftName = snapshot.profile.displayName\n                                nameDialog = true\n                            },\n                        )\n                    }\n                    item { PersonalSectionLabel(\"Preferences\") }\n                    item {\n                        PersonalPreferencesCard(\n                            snapshot = snapshot,\n                            local = localPreferences,\n                            busy = busy != null,\n                            onCurrency = { currencyDialog = true },\n                            onTheme = { themeDialog = true },\n                            onDateFormat = { dateDialog = true },\n                            onCompactChanged = {\n                                preferences.setCompactMode(it)\n                                announce(if (it) \"Compact spacing enabled.\" else \"Comfortable spacing enabled.\")\n                            },\n                        )\n                    }\n                    item { PersonalSectionLabel(\"Notifications\") }\n                    item {\n                        PersonalNotificationCard(\n                            snapshot = snapshot,\n                            busy = busy != null,\n                            onGoalAlerts = { enabled ->\n                                runAction(\"goal-alerts\", \"Goal alerts updated.\") {\n                                    repository.updateNotificationPreferences(\n                                        goalAlertsEnabled = enabled,\n                                        payableAlertsEnabled = snapshot.notificationPreferences.payableAlertsEnabled,\n                                    )\n                                }\n                            },\n                            onPayableAlerts = { enabled ->\n                                runAction(\"payable-alerts\", \"Payable alerts updated.\") {\n                                    repository.updateNotificationPreferences(\n                                        goalAlertsEnabled = snapshot.notificationPreferences.goalAlertsEnabled,\n                                        payableAlertsEnabled = enabled,\n                                    )\n                                }\n                            },\n                            onAlertClick = { alert ->\n                                if (!alert.read) {\n                                    runAction(\"alert\", \"Notification marked as read.\") {\n                                        repository.markAlertRead(alert.id)\n                                    }\n                                }\n                            },\n                        )\n                    }\n                    item { PersonalSectionLabel(\"Data portability\") }\n                    item {\n                        PersonalDataCard(\n                            busy = busy != null,\n                            onExport = {\n                                if (busy == null) scope.launch {\n                                    busy = \"export\"\n                                    when (val result = repository.exportBackup(preferences.clientPreferences())) {\n                                        is BackupExportResult.Success -> {\n                                            pendingExport = result\n                                            createBackup.launch(\n                                                \"jalvoro-personal-backup-${jalvoroTodayKey()}.jfinance\",\n                                            )\n                                        }\n                                        is BackupExportResult.Failure -> announce(result.message)\n                                    }\n                                    busy = null\n                                }\n                            },\n                            onImport = { if (busy == null) openBackup.launch(arrayOf(\"*/*\")) },\n                        )\n                    }\n                    item { PersonalSectionLabel(\"Account security\") }\n                    item {\n                        PersonalSecurityCard(\n                            email = snapshot.profile.email,\n                            busy = busy != null,\n                            onPassword = {\n                                password = \"\"\n                                confirmation = \"\"\n                                passwordDialog = true\n                            },\n                            onSignOut = {\n                                if (busy == null) scope.launch {\n                                    busy = \"sign-out\"\n                                    onSignOut()\n                                    busy = null\n                                }\n                            },\n                        )\n                    }\n                    if (state is PersonalPlatformState.Failure) {\n                        item {\n                            Text(\n                                (state as PersonalPlatformState.Failure).message,\n                                color = MaterialTheme.colorScheme.error,\n                                style = MaterialTheme.typography.bodySmall,\n                                modifier = Modifier.semantics { liveRegion = LiveRegionMode.Polite },\n                            )\n                        }\n                    }\n                }\n            }'''
          new_settings_block = '''            snapshot != null -> {\n                BoxWithConstraints(\n                    modifier = Modifier.fillMaxSize().padding(padding),\n                    contentAlignment = Alignment.TopCenter,\n                ) {\n                    val wideLayout = maxWidth >= 720.dp\n                    LazyColumn(\n                        modifier = Modifier.fillMaxSize().widthIn(max = 1_080.dp),\n                        contentPadding = PaddingValues(\n                            start = if (wideLayout) 24.dp else 18.dp,\n                            end = if (wideLayout) 24.dp else 18.dp,\n                            top = if (localPreferences.compactMode) 8.dp else 16.dp,\n                            bottom = 32.dp,\n                        ),\n                        verticalArrangement = Arrangement.spacedBy(\n                            if (localPreferences.compactMode) 9.dp else 14.dp,\n                        ),\n                    ) {\n                        item {\n                            JalvoroEntrance(index = 0, key = \"settings-summary:${snapshot.profile.preferredCurrency}:${snapshot.unreadAlertCount}:${localPreferences.themeMode}\") {\n                                PersonalSettingsSummaryCard(snapshot = snapshot, local = localPreferences)\n                            }\n                        }\n                        item { JalvoroEntrance(index = 1, key = \"settings-profile-label\") { PersonalSectionLabel(\"Profile\") } }\n                        item {\n                            JalvoroEntrance(index = 2, key = \"settings-profile:${snapshot.profile.displayName}:${snapshot.profile.avatarPath}\") {\n                                PersonalProfileCard(\n                                    snapshot = snapshot,\n                                    avatarBitmap = avatarBitmap,\n                                    busy = busy != null,\n                                    onChoosePhoto = { chooseAvatar.launch(arrayOf(\"image/jpeg\", \"image/png\", \"image/webp\")) },\n                                    onEditName = {\n                                        draftName = snapshot.profile.displayName\n                                        nameDialog = true\n                                    },\n                                )\n                            }\n                        }\n                        item { JalvoroEntrance(index = 3, key = \"settings-preferences-label\") { PersonalSectionLabel(\"Preferences\") } }\n                        item {\n                            JalvoroEntrance(index = 3, key = \"settings-preferences:${snapshot.profile.preferredCurrency}:${localPreferences.themeMode}:${localPreferences.dateFormat}:${localPreferences.compactMode}\") {\n                                PersonalPreferencesCard(\n                                    snapshot = snapshot,\n                                    local = localPreferences,\n                                    busy = busy != null,\n                                    onCurrency = { currencyDialog = true },\n                                    onTheme = { themeDialog = true },\n                                    onDateFormat = { dateDialog = true },\n                                    onCompactChanged = {\n                                        preferences.setCompactMode(it)\n                                        announce(if (it) \"Compact spacing enabled.\" else \"Comfortable spacing enabled.\")\n                                    },\n                                )\n                            }\n                        }\n                        item { JalvoroEntrance(index = 3, key = \"settings-notifications-label\") { PersonalSectionLabel(\"Notifications\") } }\n                        item {\n                            JalvoroEntrance(index = 3, key = \"settings-notifications:${snapshot.unreadAlertCount}:${snapshot.notificationPreferences}\") {\n                                PersonalNotificationCard(\n                                    snapshot = snapshot,\n                                    busy = busy != null,\n                                    onGoalAlerts = { enabled ->\n                                        runAction(\"goal-alerts\", \"Goal alerts updated.\") {\n                                            repository.updateNotificationPreferences(\n                                                goalAlertsEnabled = enabled,\n                                                payableAlertsEnabled = snapshot.notificationPreferences.payableAlertsEnabled,\n                                            )\n                                        }\n                                    },\n                                    onPayableAlerts = { enabled ->\n                                        runAction(\"payable-alerts\", \"Payable alerts updated.\") {\n                                            repository.updateNotificationPreferences(\n                                                goalAlertsEnabled = snapshot.notificationPreferences.goalAlertsEnabled,\n                                                payableAlertsEnabled = enabled,\n                                            )\n                                        }\n                                    },\n                                    onAlertClick = { alert ->\n                                        if (!alert.read) {\n                                            runAction(\"alert\", \"Notification marked as read.\") { repository.markAlertRead(alert.id) }\n                                        }\n                                    },\n                                )\n                            }\n                        }\n                        item { JalvoroEntrance(index = 3, key = \"settings-data-label\") { PersonalSectionLabel(\"Data portability\") } }\n                        item {\n                            JalvoroEntrance(index = 3, key = \"settings-data\") {\n                                PersonalDataCard(\n                                    busy = busy != null,\n                                    onExport = {\n                                        if (busy == null) scope.launch {\n                                            busy = \"export\"\n                                            when (val result = repository.exportBackup(preferences.clientPreferences())) {\n                                                is BackupExportResult.Success -> {\n                                                    pendingExport = result\n                                                    createBackup.launch(\"jalvoro-personal-backup-${jalvoroTodayKey()}.jfinance\")\n                                                }\n                                                is BackupExportResult.Failure -> announce(result.message)\n                                            }\n                                            busy = null\n                                        }\n                                    },\n                                    onImport = { if (busy == null) openBackup.launch(arrayOf(\"*/*\")) },\n                                )\n                            }\n                        }\n                        item { JalvoroEntrance(index = 3, key = \"settings-security-label\") { PersonalSectionLabel(\"Account security\") } }\n                        item {\n                            JalvoroEntrance(index = 3, key = \"settings-security:${snapshot.profile.email}\") {\n                                PersonalSecurityCard(\n                                    email = snapshot.profile.email,\n                                    busy = busy != null,\n                                    onPassword = {\n                                        password = \"\"\n                                        confirmation = \"\"\n                                        passwordDialog = true\n                                    },\n                                    onSignOut = {\n                                        if (busy == null) scope.launch {\n                                            busy = \"sign-out\"\n                                            onSignOut()\n                                            busy = null\n                                        }\n                                    },\n                                )\n                            }\n                        }\n                        if (state is PersonalPlatformState.Failure) {\n                            item {\n                                JalvoroAnimatedReveal(visible = true) {\n                                    Text(\n                                        (state as PersonalPlatformState.Failure).message,\n                                        color = MaterialTheme.colorScheme.error,\n                                        style = MaterialTheme.typography.bodySmall,\n                                        modifier = Modifier.semantics { liveRegion = LiveRegionMode.Polite },\n                                    )\n                                }\n                            }\n                        }\n                    }\n                }\n            }'''
          replace_once(settings, old_settings_block, new_settings_block)

          components = "native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/PersonalPlatformComponents.kt"
          replace_once(components, "        modifier = Modifier.fillMaxWidth(),\n        shape = RoundedCornerShape(24.dp),", "        modifier = Modifier.fillMaxWidth().jalvoroAnimateContentSize(),\n        shape = RoundedCornerShape(24.dp),")
          replace_once(components, "            Text(value, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)", "            JalvoroAnimatedSwap(\n                targetState = value,\n                label = \"settings-status-$label\",\n            ) { current ->\n                Text(current, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)\n            }")
          replace_once(components, "                    Text(\n                        snapshot.profile.displayName,\n                        style = MaterialTheme.typography.titleLarge,\n                        fontWeight = FontWeight.Bold,\n                        maxLines = 1,\n                        overflow = TextOverflow.Ellipsis,\n                    )", "                    JalvoroAnimatedSwap(\n                        targetState = snapshot.profile.displayName,\n                        label = \"settings-display-name\",\n                    ) { displayName ->\n                        Text(\n                            displayName,\n                            style = MaterialTheme.typography.titleLarge,\n                            fontWeight = FontWeight.Bold,\n                            maxLines = 1,\n                            overflow = TextOverflow.Ellipsis,\n                        )\n                    }")
          replace_once(components, "            Text(value.toString(), fontWeight = FontWeight.Bold, maxLines = 1)", "            JalvoroAnimatedSwap(\n                targetState = value.toString(),\n                label = \"settings-stat-$label\",\n            ) { current ->\n                Text(current, fontWeight = FontWeight.Bold, maxLines = 1)\n            }")
          replace_once(components, "        Text(\n            value,\n            style = MaterialTheme.typography.labelMedium,\n            color = MaterialTheme.colorScheme.primary,\n            maxLines = 2,\n        )", "        JalvoroAnimatedSwap(\n            targetState = value,\n            label = \"settings-action-$title\",\n        ) { current ->\n            Text(\n                current,\n                style = MaterialTheme.typography.labelMedium,\n                color = MaterialTheme.colorScheme.primary,\n                maxLines = 2,\n            )\n        }")
          replace_once(components, "            Text(\n                trailing,\n                style = MaterialTheme.typography.labelSmall,\n                fontWeight = FontWeight.Black,\n                color = MaterialTheme.colorScheme.primary,\n            )", "            JalvoroAnimatedSwap(\n                targetState = trailing,\n                label = \"settings-heading-trailing\",\n            ) { current ->\n                Text(\n                    current,\n                    style = MaterialTheme.typography.labelSmall,\n                    fontWeight = FontWeight.Black,\n                    color = MaterialTheme.colorScheme.primary,\n                )\n            }")
          replace_once(components, "        Text(\n            if (alert.read) \"Read\" else \"Mark read\",\n            style = MaterialTheme.typography.labelSmall,\n            color = if (alert.read) MaterialTheme.colorScheme.onSurfaceVariant else color,\n        )", "        JalvoroAnimatedSwap(\n            targetState = if (alert.read) \"Read\" else \"Mark read\",\n            label = \"settings-alert-${alert.id}\",\n        ) { current ->\n            Text(\n                current,\n                style = MaterialTheme.typography.labelSmall,\n                color = if (alert.read) MaterialTheme.colorScheme.onSurfaceVariant else color,\n            )\n        }")

          print("Patched files:")
          for path in sorted(set(touched)):
              print(f"- {path}")
          PY

          if ! git diff --quiet; then
            git config user.name "JALVORO Native CI"
            git config user.email "actions@users.noreply.github.com"
            git add native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/
            git commit -m "Refine Overview Money and Settings visual parity"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test, lint and compile native application
        run: |
          set -o pipefail
          gradle \
            :shared:testAndroidHostTest \
            :androidApp:lintDebug \
            :androidApp:lintRelease \
            :androidApp:assembleDebug \
            :androidApp:bundleRelease \
            --stacktrace 2>&1 | tee native-ci.log

      - name: Prepare physical-device test package
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p device-build
          cp \
            androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "device-build/jalvoro-personal-device-test-${PR_HEAD_SHA:0:12}.apk"
          (
            cd device-build
            sha256sum *.apk > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload physical-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-device-test-${{ github.event.pull_request.head.sha }}
          path: native/device-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload native CI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-log-${{ github.run_id }}
          path: native/native-ci.log
          if-no-files-found: ignore
          retention-days: 3
