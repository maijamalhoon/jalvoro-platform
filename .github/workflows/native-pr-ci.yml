name: Native pull request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-pr-ci.yml"
      - ".github/scripts/setup-android-sdk.cmd"
      - ".github/scripts/setup-gradle.cmd"
      - ".github/scripts/apply-native-parity-fixes.mjs"

permissions:
  contents: write

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
        working-directory: native

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          clean: false

      - name: Apply and commit native website parity source
        shell: cmd
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        working-directory: .
        run: |
          set "FIXER_LOG=%GITHUB_WORKSPACE%\native\native-fixer.log"
          "C:\Program Files\nodejs\node.exe" "%GITHUB_WORKSPACE%\.github\scripts\apply-native-parity-fixes.mjs" > "%FIXER_LOG%" 2>&1
          set "FIXER_EXIT=%ERRORLEVEL%"
          type "%FIXER_LOG%"
          if not "%FIXER_EXIT%"=="0" exit /b %FIXER_EXIT%

          git diff --check >> "%FIXER_LOG%" 2>&1
          if errorlevel 1 (
            type "%FIXER_LOG%"
            exit /b 1
          )

          set "CHANGES="
          for /f "delims=" %%A in ('git status --porcelain -- native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteWorkspaceShell.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteUtilityShell.kt') do set "CHANGES=1"
          if defined CHANGES (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteWorkspaceShell.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteUtilityShell.kt
            git commit -m "Polish native website parity shell"
            git push origin "HEAD:%PR_HEAD_REF%"
          ) else (
            echo Native website parity source is already committed.>> "%FIXER_LOG%"
          )

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\.github\scripts\setup-android-sdk.cmd"

      - name: Set up Gradle 9.3.1
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\.github\scripts\setup-gradle.cmd"

      - name: Test, lint and compile native application
        shell: cmd
        run: |
          call gradle.bat :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:lintRelease :androidApp:assembleDebug :androidApp:bundleRelease --stacktrace > native-ci.log 2>&1
          set "GRADLE_EXIT=%ERRORLEVEL%"
          type native-ci.log
          exit /b %GRADLE_EXIT%

      - name: Prepare deterministic native artifacts
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $nativeRoot = Join-Path $env:GITHUB_WORKSPACE "native"
          $gradle = "C:\Gradle\gradle-9.3.1\bin\gradle.bat"
          $artifactLog = Join-Path $nativeRoot "native-artifact-build.log"
          $pathLog = Join-Path $nativeRoot "native-artifact-paths.log"

          if (-not (Test-Path -LiteralPath $nativeRoot -PathType Container)) {
            throw "Native workspace was not found: $nativeRoot"
          }
          if (-not (Test-Path -LiteralPath $gradle -PathType Leaf)) {
            throw "Gradle executable was not found: $gradle"
          }

          Push-Location $nativeRoot
          try {
            & $gradle :androidApp:prepareDebugApkForCi :androidApp:prepareReleaseBundleForCi --rerun-tasks --no-build-cache --stacktrace *> $artifactLog
            $artifactExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }

          Get-Content -LiteralPath $artifactLog
          if ($artifactExit -ne 0) {
            throw "Deterministic APK/AAB preparation failed with exit code $artifactExit."
          }

          $apkSourceRoot = Join-Path $nativeRoot "androidApp\build\ci-artifacts\debug"
          $aabSourceRoot = Join-Path $nativeRoot "androidApp\build\ci-artifacts\release"
          $apkCandidates = @(Get-ChildItem -LiteralPath $apkSourceRoot -Filter "*.apk" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 0 } |
            Sort-Object LastWriteTimeUtc -Descending)
          $aabCandidates = @(Get-ChildItem -LiteralPath $aabSourceRoot -Filter "*.aab" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 0 } |
            Sort-Object LastWriteTimeUtc -Descending)

          @($apkCandidates + $aabCandidates) |
            ForEach-Object {
              "{0}`t{1}`t{2}" -f $_.LastWriteTimeUtc.ToString("o"), $_.Length, $_.FullName
            } |
            Set-Content -LiteralPath $pathLog -Encoding utf8

          if ($apkCandidates.Count -ne 1) {
            throw "Expected exactly one debug APK under $apkSourceRoot but found $($apkCandidates.Count)."
          }
          if ($aabCandidates.Count -ne 1) {
            throw "Expected exactly one release AAB under $aabSourceRoot but found $($aabCandidates.Count)."
          }

          $shaValue = if ([string]::IsNullOrWhiteSpace($env:PR_HEAD_SHA)) { $env:GITHUB_SHA } else { $env:PR_HEAD_SHA }
          if ([string]::IsNullOrWhiteSpace($shaValue)) { $shaValue = "unknown" }
          $shortSha = $shaValue.Substring(0, [Math]::Min(12, $shaValue.Length))

          $deviceBuild = Join-Path $nativeRoot "device-build"
          $releaseBuild = Join-Path $nativeRoot "release-build"
          Remove-Item -LiteralPath $deviceBuild, $releaseBuild -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $deviceBuild, $releaseBuild | Out-Null

          $apkTarget = Join-Path $deviceBuild "jalvoro-personal-device-test-$shortSha.apk"
          $aabTarget = Join-Path $releaseBuild "jalvoro-personal-release-$shortSha.aab"
          Copy-Item -LiteralPath $apkCandidates[0].FullName -Destination $apkTarget -Force
          Copy-Item -LiteralPath $aabCandidates[0].FullName -Destination $aabTarget -Force

          foreach ($target in @($apkTarget, $aabTarget)) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw "Prepared artifact is missing: $target"
            }
            if ((Get-Item -LiteralPath $target).Length -le 0) {
              throw "Prepared artifact is empty: $target"
            }
          }

          $apkHash = (Get-FileHash -LiteralPath $apkTarget -Algorithm SHA256).Hash.ToLowerInvariant()
          $aabHash = (Get-FileHash -LiteralPath $aabTarget -Algorithm SHA256).Hash.ToLowerInvariant()
          "$apkHash *$([IO.Path]::GetFileName($apkTarget))" |
            Set-Content -LiteralPath (Join-Path $deviceBuild "SHA256SUMS.txt") -Encoding ascii
          "$aabHash *$([IO.Path]::GetFileName($aabTarget))" |
            Set-Content -LiteralPath (Join-Path $releaseBuild "SHA256SUMS.txt") -Encoding ascii

          Write-Host "Prepared APK: $apkTarget"
          Write-Host "Prepared AAB: $aabTarget"

      - name: Upload physical-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-device-test-${{ github.event.pull_request.head.sha }}
          path: native/device-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-release-bundle-${{ github.event.pull_request.head.sha }}
          path: native/release-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-log-${{ github.run_id }}
          path: |
            native/native-fixer.log
            native/native-ci.log
            native/native-artifact-build.log
            native/native-artifact-paths.log
            native/android-sdk-setup.log
            native/gradle-setup.log
          if-no-files-found: ignore
          retention-days: 3
