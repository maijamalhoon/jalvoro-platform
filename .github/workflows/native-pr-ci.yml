name: Native pull request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-pr-ci.yml"

permissions:
  contents: write

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Synchronize latest main and restore read-only workflow
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RESTORE_SOURCE=$(git rev-parse HEAD^)
          git show "${RESTORE_SOURCE}:.github/workflows/native-pr-ci.yml" \
            > "${RUNNER_TEMP}/native-pr-ci.yml"

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            if ! git merge --no-edit -m "Merge latest main into native website parity branch" origin/main; then
              git merge --abort || true
              echo "Latest-main synchronization has conflicts; branch was not pushed."
              exit 1
            fi
          else
            echo "PR branch already contains latest main."
          fi

          cp "${RUNNER_TEMP}/native-pr-ci.yml" .github/workflows/native-pr-ci.yml
          git add .github/workflows/native-pr-ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "Restore read-only native CI after latest-main synchronization"
          fi

          git push origin "HEAD:${TARGET_BRANCH}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test, lint and compile native application
        run: |
          set -o pipefail
          gradle \
            :shared:testAndroidHostTest \
            :androidApp:lintDebug \
            :androidApp:lintRelease \
            :androidApp:assembleDebug \
            :androidApp:bundleRelease \
            --stacktrace 2>&1 | tee native-ci.log

      - name: Prepare physical-device test package
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p device-build
          cp \
            androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            "device-build/jalvoro-personal-device-test-${PR_HEAD_SHA:0:12}.apk"
          (
            cd device-build
            sha256sum *.apk > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload physical-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-device-test-${{ github.event.pull_request.head.sha }}
          path: native/device-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload native CI diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-log-${{ github.run_id }}
          path: native/native-ci.log
          if-no-files-found: ignore
          retention-days: 3
