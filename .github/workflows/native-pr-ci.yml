name: Native pull request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-pr-ci.yml"
      - ".github/scripts/setup-android-sdk.ps1"
      - ".github/scripts/setup-android-sdk.cmd"
      - ".github/scripts/apply-native-compose-compile-fixes.ps1"

permissions:
  contents: write

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
        working-directory: native

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply targeted Compose compile fixes
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:GITHUB_WORKSPACE\.github\scripts\apply-native-compose-compile-fixes.ps1"
          git diff --check
          $changes = git status --porcelain -- `
            native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt `
            native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteWorkspaceShell.kt `
            native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteUtilityShell.kt
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add `
              native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt `
              native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteWorkspaceShell.kt `
              native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteUtilityShell.kt
            git commit -m "Fix native Compose draw colors"
            git push origin "HEAD:$env:PR_HEAD_REF"
          }
          git fetch origin $env:PR_BASE_REF
          git merge --no-edit "origin/$env:PR_BASE_REF"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\.github\scripts\setup-android-sdk.cmd"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test, lint and compile native application
        shell: cmd
        run: |
          call gradle.bat :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:lintRelease :androidApp:assembleDebug :androidApp:bundleRelease --stacktrace > native-ci.log 2>&1
          set "GRADLE_EXIT=%ERRORLEVEL%"
          type native-ci.log
          exit /b %GRADLE_EXIT%

      - name: Prepare physical-device test APK
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = "androidApp\build\outputs\apk\debug\androidApp-debug.apk"
          if (-not (Test-Path $source)) { throw "Debug APK was not produced: $source" }
          New-Item -ItemType Directory -Force -Path device-build | Out-Null
          $shortSha = $env:PR_HEAD_SHA.Substring(0, [Math]::Min(12, $env:PR_HEAD_SHA.Length))
          $target = "device-build\jalvoro-personal-device-test-$shortSha.apk"
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$([IO.Path]::GetFileName($target))" | Set-Content -Path device-build\SHA256SUMS.txt -Encoding ascii
          if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw "APK checksum verification failed."
          }

      - name: Prepare release bundle
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $source = "androidApp\build\outputs\bundle\release\androidApp-release.aab"
          if (-not (Test-Path $source)) { throw "Release AAB was not produced: $source" }
          New-Item -ItemType Directory -Force -Path release-build | Out-Null
          $shortSha = $env:PR_HEAD_SHA.Substring(0, [Math]::Min(12, $env:PR_HEAD_SHA.Length))
          $target = "release-build\jalvoro-personal-release-$shortSha.aab"
          Copy-Item $source $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$([IO.Path]::GetFileName($target))" | Set-Content -Path release-build\SHA256SUMS.txt -Encoding ascii

      - name: Upload physical-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-device-test-${{ github.event.pull_request.head.sha }}
          path: native/device-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-release-bundle-${{ github.event.pull_request.head.sha }}
          path: native/release-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-log-${{ github.run_id }}
          path: |
            native/native-ci.log
            native/android-sdk-setup.log
          if-no-files-found: ignore
          retention-days: 3
