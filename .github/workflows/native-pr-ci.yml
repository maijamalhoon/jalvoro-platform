name: Native pull request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-pr-ci.yml"
      - ".github/scripts/setup-android-sdk.cmd"
      - ".github/scripts/setup-gradle.cmd"
      - ".github/scripts/apply-native-parity-fixes.mjs"

permissions:
  contents: write

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
        working-directory: native

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          clean: false

      - name: Apply and commit native website parity source
        shell: cmd
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        working-directory: .
        run: |
          set "FIXER_LOG=%GITHUB_WORKSPACE%\native\native-fixer.log"
          "C:\Program Files\nodejs\node.exe" "%GITHUB_WORKSPACE%\.github\scripts\apply-native-parity-fixes.mjs" > "%FIXER_LOG%" 2>&1
          set "FIXER_EXIT=%ERRORLEVEL%"
          type "%FIXER_LOG%"
          if not "%FIXER_EXIT%"=="0" exit /b %FIXER_EXIT%

          git diff --check >> "%FIXER_LOG%" 2>&1
          if errorlevel 1 (
            type "%FIXER_LOG%"
            exit /b 1
          )

          set "CHANGES="
          for /f "delims=" %%A in ('git status --porcelain -- native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteWorkspaceShell.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteUtilityShell.kt') do set "CHANGES=1"
          if defined CHANGES (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroOverviewDashboard.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteWorkspaceShell.kt native/androidApp/src/main/kotlin/com/jamalsfinance/nativeapp/ui/JalvoroWebsiteUtilityShell.kt
            git commit -m "Polish native website parity shell"
            git push origin "HEAD:%PR_HEAD_REF%"
          ) else (
            echo Native website parity source is already committed.>> "%FIXER_LOG%"
          )

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\.github\scripts\setup-android-sdk.cmd"

      - name: Set up Gradle 9.3.1
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\.github\scripts\setup-gradle.cmd"

      - name: Test, lint and compile native application
        shell: cmd
        run: |
          call gradle.bat :shared:testAndroidHostTest :androidApp:lintDebug :androidApp:lintRelease :androidApp:assembleDebug :androidApp:bundleRelease --stacktrace > native-ci.log 2>&1
          set "GRADLE_EXIT=%ERRORLEVEL%"
          type native-ci.log
          exit /b %GRADLE_EXIT%

      - name: Prepare physical-device test APK
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = "androidApp\build\outputs\apk\debug"
          $source = Get-ChildItem -Path $outputRoot -Filter "*.apk" -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $source) {
            $available = Get-ChildItem -Path "androidApp\build\outputs" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Debug APK was not found under $outputRoot. Available outputs:`n$($available -join "`n")"
          }
          New-Item -ItemType Directory -Force -Path device-build | Out-Null
          $shortSha = $env:PR_HEAD_SHA.Substring(0, [Math]::Min(12, $env:PR_HEAD_SHA.Length))
          $target = "device-build\jalvoro-personal-device-test-$shortSha.apk"
          Copy-Item $source.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$([IO.Path]::GetFileName($target))" | Set-Content -Path device-build\SHA256SUMS.txt -Encoding ascii
          if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
            throw "APK checksum verification failed."
          }

      - name: Prepare release bundle
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = "androidApp\build\outputs\bundle\release"
          $source = Get-ChildItem -Path $outputRoot -Filter "*.aab" -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $source) {
            $available = Get-ChildItem -Path "androidApp\build\outputs" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Release AAB was not found under $outputRoot. Available outputs:`n$($available -join "`n")"
          }
          New-Item -ItemType Directory -Force -Path release-build | Out-Null
          $shortSha = $env:PR_HEAD_SHA.Substring(0, [Math]::Min(12, $env:PR_HEAD_SHA.Length))
          $target = "release-build\jalvoro-personal-release-$shortSha.aab"
          Copy-Item $source.FullName $target -Force
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$([IO.Path]::GetFileName($target))" | Set-Content -Path release-build\SHA256SUMS.txt -Encoding ascii

      - name: Upload physical-device test APK
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-device-test-${{ github.event.pull_request.head.sha }}
          path: native/device-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: jalvoro-personal-release-bundle-${{ github.event.pull_request.head.sha }}
          path: native/release-build/
          if-no-files-found: error
          retention-days: 3

      - name: Upload native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ci-log-${{ github.run_id }}
          path: |
            native/native-fixer.log
            native/native-ci.log
            native/android-sdk-setup.log
            native/gradle-setup.log
          if-no-files-found: ignore
          retention-days: 3
