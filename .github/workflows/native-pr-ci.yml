name: Native pull request CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-pr-ci.yml"

permissions:
  contents: read

concurrency:
  group: native-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Test, lint and compile native application
        run: |
          gradle \
            :shared:testAndroidHostTest \
            :androidApp:lintDebug \
            :androidApp:lintRelease \
            :androidApp:assembleDebug \
            :androidApp:bundleRelease \
            --stacktrace
