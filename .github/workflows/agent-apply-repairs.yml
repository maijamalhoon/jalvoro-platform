name: Agent apply verified repairs

on:
  push:
    branches: [agent/final-production-audit-20260726]
    paths: [".github/workflows/agent-apply-repairs.yml"]
  pull_request:
    types: [synchronize]
    paths: [".github/workflows/agent-apply-repairs.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/final-production-audit-20260726
          fetch-depth: 0
          show-progress: false

      - name: Apply verified repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"Missing repair target: {path}")
              file.write_text(source.replace(old, new, 1))

          replace("README.md", "- Node.js 20 or newer", "- Node.js 24.x (matching `package.json` and CI)")

          replace(
              "app/dashboard/layout.tsx",
              "export const metadata: Metadata = {\n  alternates:",
              "export const metadata: Metadata = {\n  robots: { index: false, follow: false, nocache: true },\n  alternates:",
          )

          for path, title in (
              ("app/onboarding/layout.tsx", "Account setup"),
              ("app/reset-password/layout.tsx", "Reset password"),
          ):
              replace(
                  path,
                  'import type { ReactNode } from "react";\n',
                  'import type { Metadata } from "next";\nimport type { ReactNode } from "react";\n',
              )
              replace(
                  path,
                  "\nexport default function",
                  f'\nexport const metadata: Metadata = {{\n  title: "{title}",\n  robots: {{ index: false, follow: false, nocache: true }},\n}};\n\nexport default function',
              )

          Path("app/robots.ts").write_text('''import type { MetadataRoute } from "next";

          import { APP_URL } from "@/lib/brand";

          export default function robots(): MetadataRoute.Robots {
            return {
              rules: {
                userAgent: "*",
                allow: "/",
                disallow: [
                  "/api",
                  "/admin",
                  "/business",
                  "/control",
                  "/dashboard",
                  "/login",
                  "/onboarding",
                  "/reset-password",
                ],
              },
              sitemap: `${APP_URL}/sitemap.xml`,
              host: APP_URL,
            };
          }
          ''')

          replace(
              "components/ai-insights/AIInsightsExplainablePanel.tsx",
              "  const actionableCopy = getAIInsightsActionableCopy(language);\n  const { currency, formatCurrency, live, rate } = useCurrency();",
              "  const actionableCopy = getAIInsightsActionableCopy(language);\n  const unavailableMessage = copy.panel.unavailable;\n  const emptyServerMessage = copy.server.emptyMessage;\n  const { currency, formatCurrency, live, rate } = useCurrency();",
          )
          replace("components/ai-insights/AIInsightsExplainablePanel.tsx", "throw new Error(body.message ?? copy.panel.unavailable);", "throw new Error(body.message ?? unavailableMessage);")
          replace("components/ai-insights/AIInsightsExplainablePanel.tsx", "setEmptyMessage(body.message ?? copy.server.emptyMessage);", "setEmptyMessage(body.message ?? emptyServerMessage);")
          replace("components/ai-insights/AIInsightsExplainablePanel.tsx", ": copy.panel.unavailable,", ": unavailableMessage,")
          replace("components/ai-insights/AIInsightsExplainablePanel.tsx", "[copy.panel.unavailable, copy.server.emptyMessage, currency, language, live, rate],", "[currency, emptyServerMessage, language, live, rate, unavailableMessage],")

          for path in (
              "components/control-plane/control-plane-invitation.module.css",
              "components/control-plane/control-plane-owner-management.module.css",
          ):
              file = Path(path)
              file.write_text(file.read_text().replace("* { scroll-behavior: auto !important; }", ".root * { scroll-behavior: auto !important; }"))

          replace(
              "lib/security-hardening.test.ts",
              "    return /\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(path) ? [path] : [];",
              "    return /\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(path) &&\n      !/\\.(?:test|spec)\\.(?:ts|tsx|js|jsx|mjs|cjs)$/.test(path)\n      ? [path]\n      : [];",
          )

          replace(
              "tsconfig.json",
              '    "components/settings/SettingsExperience.tsx"\n',
              '    "components/settings/SettingsExperience.tsx",\n    "supabase/**/functions/**"\n',
          )
          Path("supabase/control-plane/functions/deno.json").write_text('''{
            "compilerOptions": {
              "strict": true,
              "noImplicitAny": true
            }
          }
          ''')

          replace(
              ".github/workflows/ci.yml",
              "      - name: Install dependencies\n        run: npm ci --silent",
              "      - name: Set up Deno\n        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4\n        with:\n          deno-version: 2.8.1\n          cache: true\n          cache-hash: ${{ hashFiles('supabase/**/deno.json', 'supabase/**/deno.lock') }}\n\n      - name: Install dependencies\n        run: npm ci --silent",
          )
          replace(
              ".github/workflows/ci.yml",
              "      - name: Run security contract tests\n        run: npx vitest run lib/security-hardening.test.ts",
              "      - name: Typecheck Supabase Edge Functions\n        run: deno check --config supabase/control-plane/functions/deno.json supabase/control-plane/functions/control-plane-create-operator/index.ts\n\n      - name: Run security contract tests\n        run: npx vitest run lib/security-hardening.test.ts",
          )

          Path(".github/workflows/agent-apply-repairs.yml").unlink()

      - name: Commit repairs to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI production audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: repair production verification blockers"
          git push origin HEAD:agent/final-production-audit-20260726
