# Temporary validation path used only while pull-request creation is unavailable.
name: .NET Staging Harness Branch Validation

on:
  push:
    branches:
      - agent/dotnet-staging-supabase-smoke-harness

permissions:
  contents: read
  statuses: write

concurrency:
  group: dotnet-staging-harness-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run complete branch validation
        id: validate
        shell: bash
        run: |
          set +e
          exec > >(tee staging-harness-validation.log) 2>&1

          status=0
          stage=dependency-policy
          if grep -R --include='*.csproj' '<PackageReference' backend/dotnet; then
            echo 'The Business Core foundation must not introduce third-party NuGet packages.' >&2
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            stage=restore
            dotnet restore backend/dotnet/Jalvoro.BusinessCore.sln
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            stage=format
            dotnet format backend/dotnet/Jalvoro.BusinessCore.sln --verify-no-changes --no-restore
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            stage=build
            dotnet build backend/dotnet/Jalvoro.BusinessCore.sln --configuration Release --no-restore
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            stage=contracts
            dotnet run --project backend/dotnet/tests/Jalvoro.BusinessCore.ContractTests/Jalvoro.BusinessCore.ContractTests.csproj --configuration Release --no-build
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            stage=publish
            dotnet publish backend/dotnet/src/Jalvoro.BusinessCore.Api/Jalvoro.BusinessCore.Api.csproj --configuration Release --no-build --output backend/dotnet/artifacts/publish
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            stage=complete
          fi

          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'stage=%s\n' "$stage" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload branch validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-harness-validation-${{ github.sha }}
          path: staging-harness-validation.log
          retention-days: 1
          if-no-files-found: error

      - name: Publish branch validation status
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          VALIDATION_STAGE: ${{ steps.validate.outputs.stage }}
        shell: bash
        run: |
          if [ "$VALIDATION_EXIT_CODE" = "0" ]; then
            state=success
            description="Staging harness validation passed"
          else
            state=failure
            description="Staging harness failed at ${VALIDATION_STAGE:-unknown}"
          fi

          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "$target_url" \
            --arg description "$description" \
            --arg context "jalvoro/staging-harness-validation" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"

      - name: Enforce validation result
        if: always()
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
        shell: bash
        run: exit "${VALIDATION_EXIT_CODE:-1}"
