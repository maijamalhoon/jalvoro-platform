# Temporary validation path used only while pull-request creation is unavailable.
name: .NET Staging Harness Branch Validation

on:
  push:
    branches:
      - agent/dotnet-staging-supabase-smoke-harness

permissions:
  contents: read

concurrency:
  group: dotnet-staging-harness-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Enforce dependency-free foundation
        run: |
          if grep -R --include='*.csproj' '<PackageReference' backend/dotnet; then
            echo 'The Business Core foundation must not introduce third-party NuGet packages.' >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore backend/dotnet/Jalvoro.BusinessCore.sln

      - name: Verify formatting
        run: dotnet format backend/dotnet/Jalvoro.BusinessCore.sln --verify-no-changes --no-restore

      - name: Build with warnings as errors
        run: dotnet build backend/dotnet/Jalvoro.BusinessCore.sln --configuration Release --no-restore

      - name: Run architecture and preservation contracts
        run: dotnet run --project backend/dotnet/tests/Jalvoro.BusinessCore.ContractTests/Jalvoro.BusinessCore.ContractTests.csproj --configuration Release --no-build

      - name: Publish API artifact
        run: dotnet publish backend/dotnet/src/Jalvoro.BusinessCore.Api/Jalvoro.BusinessCore.Api.csproj --configuration Release --no-build --output backend/dotnet/artifacts/publish
