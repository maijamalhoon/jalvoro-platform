name: Integration rehearsal

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stack-integrity:
    if: github.head_ref == 'integration/product-realms-pos-rehearsal-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact integration head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current main is integrated
        run: git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD

      - name: Verify stale deployment triggers remain removed
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            .vercel-deploy-trigger \
            .vercel-redeploy-security-sync \
            .vercel-swipe-redeploy \
            .vercel-trigger \
            vercel.json; do
            if [[ -e "$path" ]]; then
              echo "Stale deployment file returned: $path" >&2
              exit 1
            fi
          done

      - name: Verify ordered security and POS migrations exist
        shell: bash
        run: |
          set -Eeuo pipefail
          expected=(
            20260726181500_business_product_tier_foundation.sql
            20260726193000_immutable_account_realms.sql
            20260726193100_immutable_account_realm_enforcement.sql
            20260726211500_business_role_templates_and_lifecycle.sql
            20260726223000_business_identity_recovery.sql
            20260726223100_fix_business_identity_recovery_wrapper_execution.sql
            20260727043000_pos_workforce_security.sql
            20260727060000_pos_sale_transaction_bridge.sql
            20260727070000_pos_operations_transaction_bridge.sql
            20260728054500_seed_primary_branch_during_business_registration.sql
            20260728061500_restore_purchase_inventory_journal_sources.sql
          )
          for migration in "${expected[@]}"; do
            test -f "supabase/migrations/$migration" || {
              echo "Missing integration migration: $migration" >&2
              exit 1
            }
          done

  database-rehearsal:
    if: github.head_ref == 'integration/product-realms-pos-rehearsal-20260727'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact integration head
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Replay migrations and run database regressions locally
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/verify-supabase-integration-rehearsal.sh
          python - <<'PY'
          from pathlib import Path

          journal_path = Path("supabase/migrations/20260728061500_restore_purchase_inventory_journal_sources.sql")
          journal = journal_path.read_text()
          account_failure = """    raise exception 'Account is inactive, restricted, or invalid for this journal source.'
              using errcode = '23514';"""
          account_diagnostic = """    raise exception 'Journal account diagnostic: source=%, account_id=%, system_key=%',
              entry_source_type,new.account_id,account_system_key
              using errcode = '23514';"""
          if account_failure not in journal:
              raise SystemExit("Refund journal account diagnostic patch target changed")
          journal_path.write_text(journal.replace(account_failure, account_diagnostic, 1))

          path = Path("supabase/migrations/20260727070000_pos_operations_transaction_bridge.sql")
          text = path.read_text()
          declaration = "  caught_state text;\n  purchase_record jsonb;"
          diagnostic_declaration = "  caught_state text;\n  caught_message text;\n  purchase_record jsonb;"
          diagnostics = "    get stacked diagnostics caught_state=returned_sqlstate;"
          diagnostic_details = """    get stacked diagnostics
              caught_state=returned_sqlstate,
              caught_message=message_text;"""
          rejected = "    return jsonb_build_object('ok',false,'error',normalized_operation||'_rejected');"
          diagnostic_rejected = """    raise exception 'POS operation diagnostic [%]: %', caught_state, caught_message
              using errcode=coalesce(caught_state,'P0001');"""
          if declaration not in text or diagnostics not in text or rejected not in text:
              raise SystemExit("POS refund diagnostic patch target changed")
          path.write_text(
              text.replace(declaration, diagnostic_declaration, 1)
                  .replace(diagnostics, diagnostic_details, 1)
                  .replace(rejected, diagnostic_rejected, 1)
          )
          PY
          log_path="${GITHUB_WORKSPACE}/integration-rehearsal.log"
          set +e
          REHEARSAL_LOG_FILE=/dev/null \
            bash scripts/verify-supabase-integration-rehearsal.sh \
            2>&1 | tee "$log_path"
          rehearsal_status=${PIPESTATUS[0]}
          set -e
          test "$rehearsal_status" -eq 0
          test -s "$log_path"

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-rehearsal.log
          if-no-files-found: error
          retention-days: 14
